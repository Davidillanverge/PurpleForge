# catalog/defense/edr/elastic-defend.yml
id: elastic-defend
name: "Elastic Defend"
description: >
  Requires an Elastic Security / Fleet backend to enroll agents against —
  that backend is what detection-lab would have built. Since this project
  does not implement a SIEM/telemetry backend, defensive-controls records this
  selection in lab-manifest.json but does not install an agent; it is not
  silently skipped, the manifest says so explicitly (backend_required: true,
  status: "not implemented — needs an Elastic Fleet backend").
backend_required: true
implementation:
  engine: none
