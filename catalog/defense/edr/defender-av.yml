# catalog/defense/edr/defender-av.yml
id: defender-av
name: "Microsoft Defender Antivirus"
description: >
  Built into every Windows Server/10/11 image — no external console/backend
  required, so this is the one EDR entry PurpleForge implements end-to-end
  (pf_defender_av role) and the only value the schema's defense.edr[].product
  enum accepts. Any agent-based EDR (Elastic Security, Wazuh manager, M365,
  a LimaCharlie org, etc.) needs a management backend this project deliberately
  does not build — PREVENT/RESPOND only, no SIEM/telemetry stack.
backend_required: false
implementation:
  engine: pf_defender_av
  modes:
    enabled: "Set-MpPreference defaults; real-time protection on, ASR/network-protection per settings"
    detect: "ASR rules in AuditMode; tamper protection off"
    prevent: "ASR rules in Enabled (block) mode; tamper protection on"
  settings_supported: [asr_rules, tamper_protection, network_protection]
