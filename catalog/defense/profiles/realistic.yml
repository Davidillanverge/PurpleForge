# catalog/defense/profiles/realistic.yml
# Perfil defensivo 'realistic': Defender AV (ASR en audit) + CIS L1 con gaps
# intencionados vía reconciliación. El escenario más representativo de una
# empresa media. (Sin SIEM/telemetría — la detección queda fuera de alcance,
# invariante #2; Defender AV es el único EDR implementado end-to-end.)
profile: realistic
description: "Defender AV (ASR audit) + CIS L1 con gaps intencionados vía reconciliación. Sin SIEM (detección fuera de alcance)."
defaults:
  edr:
    - product: defender-av
      mode: enabled
      settings: { asr_rules: audit, tamper_protection: true, network_protection: true }
      targets: all
  hardening:
    baseline: cis-l1
    apply_to: all
    controls:
      laps: true
      lsa_protection: true
      credential_guard: false
      smb_signing: enforce
      ldap_signing: enforce
      disable_llmnr_nbtns_mdns: true
      ntlmv2_only: true
      mssql_hardening: true
      iis_hardening: true
      protected_users_group: []
    intentional_gaps_auto: true
  deception:
    honey_accounts: 1
