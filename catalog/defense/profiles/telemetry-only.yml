# catalog/defense/profiles/telemetry-only.yml
# Perfil defensivo 'telemetry-only': Sysmon + WEF + SIEM, sin prevención.
# Ver todo, bloquear nada -> detection engineering puro.
profile: telemetry-only
description: "Sysmon + WEF + SIEM en modo detect. Sin baseline de hardening ni EDR en prevent."
defaults:
  siem:
    platform: elastic
    ship_sysmon: true
    ship_wef: true
    network_monitoring: []
  edr:
    - product: defender-av
      mode: detect
      settings: { asr_rules: audit, tamper_protection: false, network_protection: false }
      targets: all
  hardening:
    baseline: none
    apply_to: all
    controls:
      laps: false
      lsa_protection: false
      credential_guard: false
      smb_signing: disable
      ldap_signing: disable
      disable_llmnr_nbtns_mdns: false
      ntlmv2_only: false
      protected_users_group: []
    intentional_gaps_auto: false
  deception:
    honey_accounts: 0
    canarytokens: []
