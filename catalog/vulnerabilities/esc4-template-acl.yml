id: esc4-template-acl
name: "AD CS ESC4 - ACL editable sobre una plantilla de certificado"
severity: critical
attack:
  mitre_attack: [T1649]
  requires_services: [adcs]
  intended_path: >
    Una cuenta de bajo privilegio tiene WriteDacl / WriteProperty / WriteOwner
    sobre una plantilla de certificado publicada. El atacante reconfigura la
    plantilla en caliente para volverla ESC1 (activa
    ENROLLEE_SUPPLIES_SUBJECT, permite client-authentication EKU y enrolamiento
    para 'Domain Users'), solicita un certificado especificando un SAN de Domain
    Admin, autentica como DA vía PKINIT, y opcionalmente revierte la plantilla.
    Es la variante ESC4 (control por ACL) de la familia ESC1.
inject:
  type: ansible
  playbook: templates/ansible/vulns/esc4-template-acl.yml
  reuses: "Set-Acl con una ActiveDirectoryAccessRule GenericAll para un principal nombrado sobre el objeto pKICertificateTemplate de una plantilla YA publicada en la CA (por defecto 'User'), en la Configuration NC — mismo patrón que dcsync-acl, aplicado a la plantilla en vez de al dominio. Sin ficheros ni módulos que stagear."
  params: { template: "{{ vuln_esc4_template }}", grant_to: "{{ vuln_esc4_account }}", right: GenericAll }
detect:
  data_source: "Security 4662 sobre el objeto pKICertificateTemplate (CN=<tpl>,CN=Certificate Templates,CN=Public Key Services,CN=Services,CN=Configuration,...); AD CS 4899/4898 (plantilla actualizada); 4886/4887 (solicitud/emisión) con SAN que no coincide con el solicitante"
  signal: "Modificación del DACL o de los flags (msPKI-Certificate-Name-Flag / pKIExtendedKeyUsage) de una plantilla por una cuenta no administrativa, seguida de una emisión con SAN suplantado"
  siem_rule: templates/detection/{siem}/esc4_template_acl
neutralized_by:
  - hardening.controls.adcs_template_acl_hardening   # etiqueta libre: restringir ACLs de escritura sobre plantillas
  - hardening.baseline: [cis-l2]
mitigate:
  summary: "Quitar los permisos de escritura (WriteDacl/WriteProperty/WriteOwner) sobre las plantillas a cualquier principal no tier-0; exigir aprobación del manager y mapeo fuerte de certificados; monitorizar 4662 sobre objetos pKICertificateTemplate y usar Certipy/PSPKIAudit para auditar ESC1-ESC8."
validate:
  bloodhound_edge: "ADCSESC4"
  atomic: null
chain:
  # account: casts a real population user as the principal with write control over the template.
  target_shape: account
