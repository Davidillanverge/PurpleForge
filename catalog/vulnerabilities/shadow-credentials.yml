id: shadow-credentials
name: "Shadow Credentials - escritura de msDS-KeyCredentialLink sobre una cuenta privilegiada"
severity: critical
attack:
  mitre_attack: [T1098.005]
  requires_services: []
  intended_path: >
    Un grupo de bajo privilegio (por defecto en este catálogo, "Domain
    Users") tiene concedido WriteProperty sobre el atributo
    msDS-KeyCredentialLink de una cuenta privilegiada (svc-tier0-admin,
    miembro de Domain Admins). Cualquier miembro de ese grupo puede añadir
    su propia clave pública como "Key Credential" (técnica Whisker/Shadow
    Credentials) y autenticarse como la cuenta privilegiada vía PKINIT sin
    conocer ni cambiar su contraseña, obteniendo su TGT y, con él, su hash
    NT (vía U2U) -control total de la cuenta sin tocar el flujo de
    contraseña en absoluto.
inject:
  type: ansible
  playbook: templates/ansible/vulns/shadow-credentials.yml
  params: { target_account: svc-tier0-admin, writer_group: "Domain Users" }
detect:
  data_source: "Security 5136 (Directory Service Changes) sobre msDS-KeyCredentialLink; Security 4768/4769 con PKINIT (certificate-based pre-auth) para una cuenta que nunca usa smart-card"
  signal: "5136 con atributo msDS-KeyCredentialLink modificado por una cuenta que no es la propia cuenta ni un administrador Tier 0 delegado"
  siem_rule: templates/detection/{siem}/shadow_credentials
# HONESTO: ninguna regla CIS/STIG fijada restringe permisos por atributo
# sobre objetos AD -es higiene de ACL, no un ajuste de registro/GPO-.
# hardening.controls.protected_users_group NO neutraliza esto: Protected
# Users bloquea NTLM/delegación/caché de credenciales, pero NO impide
# PKINIT vía una key credential añadida por un tercero con permisos.
# No existe ningún control togglable en este esquema que lo neutralice.
neutralized_by:
  - hardening.controls.attribute_level_acl_governance
mitigate:
  summary: "Auditar y restringir WriteProperty/GenericWrite sobre msDS-KeyCredentialLink a Tier 0 exclusivamente; monitorizar cambios con Whisker/Certipy-style detection; considerar Credential Guard + smart-card-required donde el uso de PKINIT no sea legítimo para la cuenta."
validate:
  bloodhound_edge: "AddKeyCredentialLink"
  atomic: null
