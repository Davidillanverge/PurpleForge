id: webapp-path-traversal
name: "Aplicación web ASP.NET con path traversal / LFI (lectura de ficheros arbitrarios)"
severity: high
attack:
  mitre_attack: [T1083, T1190]
  requires_services: [iis]
  intended_path: >
    Una aplicación web ASP.NET desplegada en IIS (/app/download.aspx) pasa el
    parámetro `file` de la query string directamente a Response.WriteFile sin
    canonicalizar ni validar la ruta. Un atacante inyecta secuencias de traversal
    (../../../) para salir del directorio de la aplicación y leer ficheros
    arbitrarios del sistema (web.config con cadenas de conexión, hashes SAM
    exportados, ficheros de configuración con secretos, etc.) con los permisos
    de la identidad del app pool -> divulgación de información sensible que
    alimenta movimiento lateral / escalada.
inject:
  type: ansible
  playbook: templates/ansible/vulns/webapp-path-traversal.yml
  primitive: "app ASP.NET /app/download.aspx que hace Response.WriteFile con la ruta concatenada sin sanitizar"
  reuses: "El servidor IIS base lo instala service-provisioning.yml de forma segura; esta inyección despliega la aplicación web vulnerable encima (y habilita ASP.NET 4.5, que el baseline no instala)"
  params: {}
neutralized_by:
  - hardening.controls.webapp_path_canonicalization   # etiqueta libre: canonicalizar la ruta y confinarla a un directorio base (allowlist); es un fallo de código, no hay regla CIS/STIG que lo cubra, así que NO se empareja con hardening.baseline
mitigate:
  summary: "Nunca construir rutas con entrada del usuario sin canonicalizar (Path.GetFullPath) y verificar que el resultado queda dentro de un directorio base permitido; usar una allowlist de ficheros/ids en lugar de nombres libres; ejecutar el app pool con mínimo privilegio para limitar qué puede leer."
validate:
  atomic: null
  bloodhound_edge: null
  local_check: "GET http://<ip>/app/download.aspx?file=../pf_lfi_canary.txt devuelve 'PF-LFI-CANARY' (canario plantado un nivel por encima del dir de la app) -> traversal confirmado; también ../../../Windows/win.ini lee ficheros del sistema"
chain:
  target_shape: none
