id: webapp-unrestricted-upload
name: "Aplicación web ASP.NET con subida de archivos sin restricción (webshell)"
severity: critical
attack:
  mitre_attack: [T1190, T1505.003]
  requires_services: [iis]
  intended_path: >
    Una aplicación web ASP.NET desplegada en IIS (/app/upload.aspx) acepta
    subidas de archivos sin validar extensión, tipo de contenido ni destino, y
    las guarda en un directorio que IIS ejecuta. Un atacante sube un webshell
    .aspx mediante el formulario de subida y lo solicita por GET -> el worker de
    IIS lo ejecuta con la identidad del app pool, dando ejecución remota de
    código en el servidor web. Encadena con iis-apppool-privileged-identity
    (si el app pool corre como LocalSystem, el webshell es SYSTEM directamente).
inject:
  type: ansible
  playbook: templates/ansible/vulns/webapp-unrestricted-upload.yml
  primitive: "app ASP.NET /app/upload.aspx que hace SaveAs sin validar extensión/tipo/destino, en un dir ejecutable por IIS"
  reuses: "El servidor IIS base lo instala service-provisioning.yml de forma segura; esta inyección despliega la aplicación web vulnerable encima (y habilita ASP.NET 4.5, que el baseline no instala)"
  params: {}
neutralized_by:
  - hardening.controls.webapp_upload_validation   # etiqueta libre: validar extensión/tipo y guardar fuera de un dir ejecutable (allowlist); es un fallo de código, no hay regla CIS/STIG que lo cubra, así que NO se empareja con hardening.baseline
mitigate:
  summary: "Validar las subidas por allowlist de extensión Y tipo de contenido; renombrar con un nombre aleatorio sin extensión ejecutable; guardar fuera de la raíz web o en un dir sin permisos de ejecución (quitar handler mappings); limitar tamaño; ejecutar el app pool con mínimo privilegio."
validate:
  atomic: null
  bloodhound_edge: null
  local_check: "curl -F 'f=@shell.txt;filename=pf_upload_probe.txt' http://<ip>/app/upload.aspx devuelve 'UPLOAD_OK' y luego GET http://<ip>/app/pf_upload_probe.txt devuelve el contenido subido (escritura sin restricción confirmada; con un .aspx = RCE)"
chain:
  target_shape: none
