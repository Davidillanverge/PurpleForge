id: smb-signing-disabled
name: "SMB signing no requerido - relay NTLM sobre SMB"
severity: high
attack:
  mitre_attack: [T1557.001]
  requires_services: []
  intended_path: >
    Con SMB signing no requerido en los hosts, un atacante en la red que
    captura o coacciona una autenticación NTLM (LLMNR/NBT-NS poisoning,
    PetitPotam, etc.) puede retransmitirla (ntlmrelayx) contra otro host SMB
    y ejecutar acciones como la víctima sin conocer su contraseña.
inject:
  type: ansible
  playbook: templates/ansible/vulns/smb-signing-disabled.yml
  primitive: "custom — win_regedit sobre RequireSecuritySignature (patrón de vendor/GOAD/ansible/roles/vulns/smbv1)"
  params: { require_security_signature: 0, enable_security_signature: 0 }
detect:
  data_source: "Security 4624 (logon tipo 3 NTLM); Sysmon 3 (conexión de red); NDR de red"
  signal: "Autenticación NTLM entrante relayada: mismo origen autenticándose a múltiples destinos SMB en ventana corta sin firma"
  siem_rule: templates/detection/{siem}/smb_signing_disabled
neutralized_by:
  # Real, host-CIS-backed control: enforcing SMB signing (CIS 2.3.8.x/2.3.9.x,
  # level 1) directly closes this. This is the concrete, demonstrable
  # reconciliation case — see catalog/defense/hardening/control-cis-rules.yml.
  - hardening.controls.smb_signing
mitigate:
  summary: "Requerir SMB signing en clientes y servidores (RequireSecuritySignature=1); deshabilitar NTLM donde sea posible; segmentar la red."
validate:
  bloodhound_edge: null
  atomic: null
chain:
  target_shape: none
