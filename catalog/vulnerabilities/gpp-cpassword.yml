id: gpp-cpassword
name: "GPP cPassword - credenciales cifradas (y crackeables) en Group Policy Preferences"
severity: high
attack:
  mitre_attack: [T1552.006]
  requires_services: []
  intended_path: >
    Una Group Policy Preference (Groups.xml, ScheduledTasks.xml, ...) previa a
    MS14-025 deja un atributo cPassword cifrado con la clave AES-256 simétrica
    que Microsoft publicó en MSDN, legible por cualquier usuario autenticado
    del dominio en SYSVOL; se descifra offline en segundos y entrega una
    contraseña de administrador local válida.
inject:
  type: ansible
  playbook: templates/ansible/vulns/gpp-cpassword.yml
  reuses: "patrón de vendor/GOAD/ansible/roles/vulns/credentials + gpo_creation de ansible-lockdown para el manejo de GPOs/SYSVOL"
  params: { gpo_name: "Local Admin Password", cpassword_account: "Administrator (local)" }
detect:
  data_source: "Acceso a ficheros en SYSVOL; Security 5145 (acceso a objeto de red)"
  signal: "Lectura de Groups.xml/ScheduledTasks.xml bajo \\\\<dominio>\\SYSVOL con atributo cpassword presente"
  siem_rule: templates/detection/{siem}/gpp_cpassword
# NOTE: the hardening.controls.<label> entry below is a conceptual/unverified
# placeholder — no matching ansible-lockdown CIS rule was found for it during
# Fase 6's audit (see catalog/defense/hardening/control-cis-rules.yml, which only
# lists VERIFIED control->rule mappings). The reconciliation still treats it as
# 'bundled in this baseline' for warn/exclude-control purposes, but defensive-
# controls cannot derive a concrete skip_rule for it — only the baseline-level
# conflict is recorded, not a rule number.
neutralized_by:
  - hardening.controls.gpp_cpassword_removed   # etiqueta libre: remediación MS14-025, purga de cPassword existentes en SYSVOL
  - hardening.baseline: [cis-l1, cis-l2, stig]
mitigate:
  summary: "Eliminar toda GPP con cPassword (MS14-025); no usar GPP para distribuir credenciales; usar LAPS."
validate:
  bloodhound_edge: null
  atomic: T1552.006
chain:
  # none: domain-wide artifact, not tied to a casted account/group.
  target_shape: none
