id: autologon-credentials
name: "AutoAdminLogon con contraseña en claro en el registro"
severity: high
attack:
  mitre_attack: [T1552.002]
  requires_services: []
  target_role: workstation
  intended_path: >
    El inicio de sesión automático está configurado en
    HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon con
    AutoAdminLogon=1 y la contraseña guardada en claro en el valor
    DefaultPassword (junto a DefaultUserName/DefaultDomainName). Cualquier
    usuario puede leer esa clave del registro -> recupera la credencial en
    claro de la cuenta de autologon y la reutiliza para escalar o moverse
    lateralmente.
inject:
  type: ansible
  playbook: templates/ansible/vulns/autologon-credentials.yml
  primitive: "AutoAdminLogon=1 + DefaultPassword en claro en Winlogon"
  params:
    account: "{{ vuln_autologon_account }}"
    password: "{{ vuln_autologon_password }}"
neutralized_by:
  - hardening.controls.disable_autologon_cleartext_password   # etiqueta libre: AutoAdminLogon=0 y borrar DefaultPassword
  - hardening.baseline: [cis-l1, cis-l2, stig]
mitigate:
  summary: "Poner AutoAdminLogon=0 y borrar DefaultPassword del registro; si se necesita autologon, usar LSA Secrets (sysinternals Autologon) en lugar de texto en claro; aplicar las baselines CIS/STIG que prohíben la contraseña de autologon en claro."
validate:
  atomic: null
  bloodhound_edge: null
  local_check: "Get-ItemProperty 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon' muestra AutoAdminLogon=1 y un DefaultPassword no vacío"
chain:
  target_shape: account
