id: passwords-in-description
name: "Contraseña en el atributo description de un objeto de usuario"
severity: medium
attack:
  mitre_attack: [T1552]
  requires_services: []
  intended_path: >
    Un administrador anota una contraseña temporal u operativa en el atributo
    'description' de una cuenta de usuario, legible por cualquier usuario
    autenticado del dominio vía una consulta LDAP simple, entregando
    credenciales válidas sin necesidad de crackeo.
inject:
  type: powershell
  primitive: "vendor/Vulnerable-AD/vulnad.ps1#VulnAD-PwdInObjectDescription"
  playbook: templates/ansible/vulns/passwords-in-description.yml
  params: { count: 3 }
detect:
  data_source: "LDAP query logging (Directory Service 1644 / Splunk-Stream-LDAP); recolección SharpHound/BloodHound"
  signal: "Atributo description que matchea un patrón heurístico de contraseña ('pass', 'pwd', longitud+complejidad)"
  siem_rule: templates/detection/{siem}/passwords_in_description
# NOTE: the hardening.controls.<label> entry below is a conceptual/unverified
# placeholder — no matching ansible-lockdown CIS rule was found for it during
# Fase 6's audit (see catalog/defense/hardening/control-cis-rules.yml, which only
# lists VERIFIED control->rule mappings). The reconciliation still treats it as
# 'bundled in this baseline' for warn/exclude-control purposes, but defensive-
# controls cannot derive a concrete skip_rule for it — only the baseline-level
# conflict is recorded, not a rule number.
neutralized_by:
  - hardening.controls.ad_object_description_audit   # etiqueta libre: auditoría periódica de description/notes/info
  - hardening.baseline: [cis-l1, cis-l2, stig]
mitigate:
  summary: "Purgar contraseñas de atributos LDAP legibles por cualquiera; auditoría periódica de description/notes/info; usar un gestor de secretos."
validate:
  bloodhound_edge: null
  atomic: null
