id: mssql-weak-sa
name: "MSSQL sa habilitada con contraseña débil y xp_cmdshell activo"
severity: critical
attack:
  mitre_attack: [T1505.001]
  requires_services: [mssql]
  intended_path: >
    El login SQL 'sa' está habilitado con autenticación mixta (SQL + Windows)
    y una contraseña débil, y el procedimiento extendido xp_cmdshell está
    activo. Un atacante autentica como sa (contraseña débil, alcanzable por
    fuerza bruta/diccionario) y ejecuta xp_cmdshell para correr comandos del
    sistema operativo con el contexto de la cuenta de servicio de SQL Server
    -> ejecución de código en el host que aloja la base de datos.
inject:
  type: ansible
  playbook: templates/ansible/vulns/mssql-weak-sa.yml
  reuses: "vendor/GOAD/ansible/roles/mssql (instalador de SQL Server 2019 Express + config.ini) para el aprovisionamiento base seguro en service-provisioning.yml; la inyección en sí (habilitar sa/mixed-mode/xp_cmdshell) es autoría de PurpleForge, vía SqlCmd -E reutilizando la cuenta de administrador de dominio ya sysadmin por ADDCURRENTUSERASSQLADMIN"
  params: { sa_password: "{{ vuln_mssql_sa_password }}" }
# NOTE: mssql_hardening is a real PurpleForge pf_controls toggle (a SqlCmd task in
# templates/ansible/roles/pf_controls, gated on hosts running MSSQL), NOT an
# ansible-lockdown CIS/STIG rule — SQL Server hardening is outside the Windows-OS
# surface lockdown covers, so it has no control-cis-rules.yml entry and this vuln
# is deliberately NOT paired with `hardening.baseline` (claiming CIS/STIG
# neutralizes a SQL-layer gap would be false). The toggle is in
# FIXED_HARDENING_TOGGLES, so the reconciler treats it like smb_signing/ntlmv2_only:
# the realistic/hardened profiles enable it, and on_conflict:exclude-control forces
# it off here so the gap stays open — while a lab WITHOUT this vuln gets a genuinely
# hardened SQL box. There is no explicit "off" branch in the toggle: the base
# install is already secure and this vuln-injection owns re-opening the gap.
neutralized_by:
  - hardening.controls.mssql_hardening   # pf_controls toggle: disable sa + xp_cmdshell on MSSQL hosts
mitigate:
  summary: "Deshabilitar el login sa (o forzarle una contraseña fuerte + CHECK_POLICY=ON); usar solo autenticación Windows; deshabilitar xp_cmdshell vía sp_configure salvo necesidad explícita y auditada; auditar logins de sa."
validate:
  atomic: null
  local_check: "SqlCmd -E -Q \"SELECT is_disabled FROM sys.server_principals WHERE name='sa'\" = 0 y sp_configure 'xp_cmdshell' = 1; o nxc mssql <ip> -u sa -p <pass> --local-auth -x whoami devuelve salida"
chain:
  target_shape: none
