id: iis-webdav-anonymous-write
name: "WebDAV habilitado en IIS con escritura anónima (subida de webshell)"
severity: critical
attack:
  mitre_attack: [T1190, T1505.003]
  requires_services: [iis]
  intended_path: >
    service-provisioning instaló IIS de forma SEGURA (Web-DAV-Publishing
    ausente, autenticación anónima de solo lectura). Esta inyección reabre el
    gap: instala el rol WebDAV, lo habilita en el Default Web Site y crea una
    regla de autoría que permite escritura anónima sobre wwwroot. Un atacante
    sin credenciales sube un archivo .aspx mediante el método HTTP PUT
    (WebDAV) y lo solicita por GET -> el app pool de IIS lo ejecuta como su
    identidad de servicio, dando ejecución remota de código en el servidor
    web (webshell), punto de apoyo para escalada local (p. ej. SeImpersonate).
inject:
  type: ansible
  playbook: templates/ansible/vulns/iis-webdav-anonymous-write.yml
  primitive: "rol WebDAV + regla de autoría con escritura anónima sobre el Default Web Site"
  reuses: "El servidor IIS base lo instala service-provisioning.yml (templates/ansible/services/iis-install.yml) de forma segura; esta inyección solo reabre el gap (WebDAV + escritura anónima), misma relación base-segura -> gap que mssql-weak-sa"
  params: {}
# NOTE: iis_hardening is a real PurpleForge pf_controls toggle (a task in
# templates/ansible/roles/pf_controls, gated on hosts running IIS), NOT an
# ansible-lockdown CIS/STIG rule — IIS web-server hardening is outside the
# Windows-OS surface lockdown covers, so it has no control-cis-rules.yml entry
# and this vuln is deliberately NOT paired with `hardening.baseline`. Same shape
# as mssql_hardening: the toggle is in FIXED_HARDENING_TOGGLES, the
# realistic/hardened profiles enable it (removing WebDAV + blocking the PUT
# verb), and on_conflict:exclude-control forces it off here so the gap stays
# open — while a lab WITHOUT this vuln gets a genuinely hardened IIS box.
neutralized_by:
  - hardening.controls.iis_hardening   # pf_controls toggle: remove WebDAV + block the PUT verb on IIS hosts
mitigate:
  summary: "Desinstalar el rol WebDAV (Web-DAV-Publishing) salvo necesidad explícita; si se requiere, deshabilitar la escritura anónima y el método PUT, exigir autenticación y restringir por ACL las carpetas de autoría; ejecutar el app pool con identidad de mínimo privilegio."
validate:
  atomic: null
  bloodhound_edge: null
  local_check: "curl -s -o /dev/null -w '%{http_code}' -X PUT http://<ip>/pf_probe.txt --data x devuelve 201/200 (escritura anónima); o Get-WindowsFeature Web-DAV-Publishing está Installed y la regla de autoría permite escritura a '*' anónimo"
chain:
  target_shape: none
