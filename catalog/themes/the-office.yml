# catalog/themes/the-office.yml — see medieval-kingdom.yml's header comment
# for how `vocabulary`/`extra_groups`/`honey_account_naming` are consumed.
id: the-office
name: "Dunder Mifflin Scranton"
description: >
  The Scranton branch of a mid-size paper company standing in for BadBlood's
  corporate departments — same non-literal, flavor-only use of a well-known
  setting already established in this repo's the-simpsons theme (Springfield
  institutions).

vocabulary:
  houses:                    # -> 3lettercodes.csv (code,description); "departments" here
    - { code: SAL, name: "Sales" }
    - { code: ACC, name: "Accounting" }
    - { code: WHS, name: "Warehouse" }
    - { code: REC, name: "Reception" }
    - { code: CST, name: "Customer Service" }
    - { code: HRD, name: "Human Resources" }
    - { code: COR, name: "Corporate" }
    - { code: ANX, name: "The Annex" }

