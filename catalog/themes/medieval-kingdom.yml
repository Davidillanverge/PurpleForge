# catalog/themes/medieval-kingdom.yml
#
# Consumed by scripts/forge.py's ad-theming rendering (see
# .claude/skills/ad-theming/SKILL.md): `vocabulary.houses` becomes
# BadBlood's AD_OU_CreateStructure/3lettercodes.csv (department codes used
# for Tier1/Tier2/Stage/People sub-OUs AND computer-name prefixes),
# `vocabulary.given_names_*`/`family_names` become BadBlood's
# AD_Users_Create/Names/*.txt. `extra_groups` and `honey_account_naming` are
# consumed by the ad_theming_overlay role, which is PurpleForge-authored
# curation layered on top of BadBlood's own output (not a BadBlood concept).
id: medieval-kingdom
name: "Medieval Kingdom"
description: >
  A fractious kingdom of rival houses — the classic Seven-Kingdoms-style
  fantasy setting vendor/GOAD's own default lab (ad/GOAD/data/config.json)
  already uses for its host names (kingslanding, winterfell); this theme
  extends the same flavor to the population layer.

vocabulary:
  houses:                    # -> 3lettercodes.csv (code,description)
    - { code: STK, name: "House Stark" }
    - { code: LAN, name: "House Lannister" }
    - { code: BAR, name: "House Baratheon" }
    - { code: TAR, name: "House Targaryen" }
    - { code: TYR, name: "House Tyrell" }
    - { code: MAR, name: "House Martell" }
    - { code: GRE, name: "House Greyjoy" }
    - { code: ARR, name: "House Arryn" }
    - { code: TUL, name: "House Tully" }
    - { code: BOL, name: "House Bolton" }

  given_names_male:          # -> Names/malenames-usa-top1000.txt equivalent
    - Eddard
    - Robb
    - Jon
    - Brandon
    - Rickon
    - Tyrion
    - Jaime
    - Tywin
    - Robert
    - Stannis
    - Renly
    - Joffrey
