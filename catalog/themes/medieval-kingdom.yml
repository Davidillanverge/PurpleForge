    - Hightower

extra_groups:
  - { name: "Small Council", description: "Royal advisors — highly privileged, Domain Admins-adjacent" }
  - { name: "Kingsguard", description: "Elite protectors of the DCs and Tier 0 assets" }
  - { name: "Maesters Order", description: "Keepers of records and systems — server/IT admin tier" }
  - { name: "Nights Watch", description: "Isolated frontier service accounts — low-trust, segregated" }

honey_account_naming: "grand.maester.{n}"   # deception.honey_accounts naming pattern
