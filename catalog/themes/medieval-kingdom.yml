    - Loras
    - Willas
    - Garlan
    - Jorah
    - Barristan
    - Davos
    - Edmure
    - Hoster

  given_names_female:        # -> Names/femalenames-usa-top1000.txt equivalent
    - Catelyn
    - Sansa
    - Arya
    - Lyanna
    - Cersei
    - Myrcella
    - Margaery
    - Olenna
