# PurpleForge pre-commit hooks. Install once:  pre-commit install
# Mirrors the CI `quality` + `secrets` gates so failures surface locally.
exclude: '^(vendor/|generated/)'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # Run over the whole scripts/ package (config in pyproject.toml) rather
        # than just the staged files — forge.py imports population cross-file.
        pass_filenames: false
        additional_dependencies:
          - types-PyYAML>=6.0
          - types-jsonschema>=4.20

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml
        # Skip Jinja templates (not valid YAML) — those live under templates/.
        exclude: '^templates/'
