[defaults]
inventory = inventory/hosts.yml
; Reuse vendor/GOAD's and vendor/ansible-lockdown's roles directly (each
; Windows-*-CIS/-STIG directory IS a role: vendor/ansible-lockdown/Windows-
; 2022-CIS/tasks/main.yml, so vendor/ansible-lockdown itself is the roles_path
; entry, not a "roles/" subdirectory of it). templates/ansible/roles/ is for
; PurpleForge-authored roles only (pf_controls/pf_defender_av/pf_deception/
; ad_theming_overlay) — don't fork GOAD's or ansible-lockdown's roles here.
roles_path = ../../../vendor/GOAD/ansible/roles:../../../vendor/ansible-lockdown:../../../templates/ansible/roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[winrm]
; WinRM over the WireGuard tunnel only — see network-topology's NSG rules,
; there is no path to 5985/5986 from outside the management subnet.
