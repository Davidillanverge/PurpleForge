---
- name: "PurpleForge | verify | AD topology + population + theme groups (blackpearl.local)"
  hosts: "dc01"
  gather_facts: false
  tasks:
    - name: "verify | AD domain DNSRoot"
      ansible.windows.win_shell: |
        $d = Get-ADDomain
        if ($d.DNSRoot -eq "blackpearl.local") { Write-Output "PASS: domain DNSRoot is blackpearl.local" }
        else { Write-Output "FAIL: expected DNSRoot blackpearl.local, got $($d.DNSRoot)" }
      register: r_domain_1
      changed_when: false
      ignore_errors: true

    - name: "verify | AD domain DNSRoot | result"
      ansible.builtin.debug:
        msg: "{{ r_domain_1.stdout }}"

    - name: "verify | population counts match the precomputed plan (scripts/population.py)"
      ansible.windows.win_shell: |
        $u = (Get-ADUser -Filter *).Count
        $g = (Get-ADGroup -Filter *).Count
        $c = (Get-ADComputer -Filter *).Count
        Write-Output "actual: $u users / $g groups / $c computers (plan expected: 22 / 7 / 7 plus AD's own built-in objects and any vuln-injection accounts cast onto them)"
      register: r_pop_1
      changed_when: false
      ignore_errors: true

    - name: "verify | population counts | result"
      ansible.builtin.debug:
        msg: "{{ r_pop_1.stdout }}"

    - name: "verify | theme group 'Pirate Lords' exists"
      ansible.windows.win_shell: |
        if (Get-ADGroup -Identity "Pirate Lords" -ErrorAction SilentlyContinue) { Write-Output "PASS: group 'Pirate Lords' exists" }
        else { Write-Output "FAIL: group 'Pirate Lords' not found" }
      register: r_grp_1_0
      changed_when: false
      ignore_errors: true

    - name: "verify | theme group 'Pirate Lords' | result"
      ansible.builtin.debug:
        msg: "{{ r_grp_1_0.stdout }}"

    - name: "verify | theme group 'Black Pearl Officers' exists"
      ansible.windows.win_shell: |
        if (Get-ADGroup -Identity "Black Pearl Officers" -ErrorAction SilentlyContinue) { Write-Output "PASS: group 'Black Pearl Officers' exists" }
        else { Write-Output "FAIL: group 'Black Pearl Officers' not found" }
      register: r_grp_2_1
      changed_when: false
      ignore_errors: true

    - name: "verify | theme group 'Black Pearl Officers' | result"
      ansible.builtin.debug:
        msg: "{{ r_grp_2_1.stdout }}"

    - name: "verify | theme group 'East India Trading Company' exists"
      ansible.windows.win_shell: |
        if (Get-ADGroup -Identity "East India Trading Company" -ErrorAction SilentlyContinue) { Write-Output "PASS: group 'East India Trading Company' exists" }
        else { Write-Output "FAIL: group 'East India Trading Company' not found" }
      register: r_grp_3_2
      changed_when: false
      ignore_errors: true

    - name: "verify | theme group 'East India Trading Company' | result"
      ansible.builtin.debug:
        msg: "{{ r_grp_3_2.stdout }}"

    - name: "verify | theme group 'Tortuga Deckhands' exists"
      ansible.windows.win_shell: |
        if (Get-ADGroup -Identity "Tortuga Deckhands" -ErrorAction SilentlyContinue) { Write-Output "PASS: group 'Tortuga Deckhands' exists" }
        else { Write-Output "FAIL: group 'Tortuga Deckhands' not found" }
      register: r_grp_4_3
      changed_when: false
      ignore_errors: true

    - name: "verify | theme group 'Tortuga Deckhands' | result"
      ansible.builtin.debug:
        msg: "{{ r_grp_4_3.stdout }}"

- name: "PurpleForge | verify | hardening — machine-wide controls"
  hosts: "dc01:ws01"
  gather_facts: false
  tasks:
    - name: "verify | lsa_protection (RunAsPPL) — expected: set to 1"
      ansible.windows.win_shell: |
        $v = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name RunAsPPL -ErrorAction SilentlyContinue).RunAsPPL
        if ($v -eq 1) { Write-Output "PASS: RunAsPPL is 1" } else { Write-Output "FAIL: expected RunAsPPL=1, got $v" }
      register: r_lsa
      changed_when: false
      ignore_errors: true
    - ansible.builtin.debug: { msg: "{{ r_lsa.stdout }}" }

    - name: "verify | smb_signing (RequireSecuritySignature) — expected 1"
      ansible.windows.win_shell: |
        $srv = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters' -Name RequireSecuritySignature -ErrorAction SilentlyContinue).RequireSecuritySignature
        $wks = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters' -Name RequireSecuritySignature -ErrorAction SilentlyContinue).RequireSecuritySignature
        $expected = 1
        if ($srv -eq $expected -and $wks -eq $expected) { Write-Output "PASS: RequireSecuritySignature is $expected (server+client)" }
        else { Write-Output "FAIL: expected $expected, got server=$srv client=$wks" }
      register: r_smb
      changed_when: false
      ignore_errors: true
    - ansible.builtin.debug: { msg: "{{ r_smb.stdout }}" }

    - name: "verify | ntlmv2_only (LMCompatibilityLevel) — expected 5"
      ansible.windows.win_shell: |
        $v = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name LMCompatibilityLevel -ErrorAction SilentlyContinue).LMCompatibilityLevel
        $expected = 5
        if ($v -eq $expected) { Write-Output "PASS: LMCompatibilityLevel is $expected" } else { Write-Output "FAIL: expected $expected, got $v" }
      register: r_ntlm
      changed_when: false
      ignore_errors: true
    - ansible.builtin.debug: { msg: "{{ r_ntlm.stdout }}" }

    - name: "verify | credential_guard (EnableVirtualizationBasedSecurity) — expected 0"
      ansible.windows.win_shell: |
        $v = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard' -Name EnableVirtualizationBasedSecurity -ErrorAction SilentlyContinue).EnableVirtualizationBasedSecurity
        $expected = 0
        if ($v -eq $expected) { Write-Output "PASS: EnableVirtualizationBasedSecurity is $expected" } else { Write-Output "FAIL: expected $expected, got $v" }
      register: r_cg
      changed_when: false
      ignore_errors: true
    - ansible.builtin.debug: { msg: "{{ r_cg.stdout }}" }

    - name: "verify | disable_llmnr_nbtns_mdns (mDNS EnableMulticast) — expected 0"
      ansible.windows.win_shell: |
        $v = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' -Name EnableMulticast -ErrorAction SilentlyContinue).EnableMulticast
        $expected = 0
        if ($v -eq $expected) { Write-Output "PASS: EnableMulticast is $expected" } else { Write-Output "FAIL: expected $expected, got $v" }
      register: r_mdns
      changed_when: false
      ignore_errors: true
    - ansible.builtin.debug: { msg: "{{ r_mdns.stdout }}" }

    - name: "verify | disable_llmnr_nbtns_mdns (Dnscache EnableMDNS) — expected 0"
      ansible.windows.win_shell: |
        $v = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Dnscache\Parameters' -Name EnableMDNS -ErrorAction SilentlyContinue).EnableMDNS
        $expected = 0
        if ($v -eq $expected) { Write-Output "PASS: EnableMDNS is $expected" } else { Write-Output "FAIL: expected $expected, got $v" }
      register: r_mdns2
      changed_when: false
      ignore_errors: true
    - ansible.builtin.debug: { msg: "{{ r_mdns2.stdout }}" }

    - name: "verify | laps (Windows LAPS policy) — expected: BackupDirectory=2"
      ansible.windows.win_shell: |
        $v = (Get-ItemProperty -Path 'HKLM:\Software\Microsoft\Policies\LAPS' -Name BackupDirectory -ErrorAction SilentlyContinue).BackupDirectory
        if ($v -eq 2) { Write-Output "PASS: LAPS BackupDirectory is 2 (Active Directory)" } else { Write-Output "FAIL: expected BackupDirectory=2, got $v" }
      register: r_laps
      changed_when: false
      ignore_errors: true
    - ansible.builtin.debug: { msg: "{{ r_laps.stdout }}" }

- name: "PurpleForge | verify | hardening — DC-only controls"
  hosts: "dc01"
  gather_facts: false
  tasks:
    - name: "verify | ldap_signing (LDAPServerIntegrity) — expected 2"
