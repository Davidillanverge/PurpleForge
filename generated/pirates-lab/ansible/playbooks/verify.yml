        $expected = 2
        if ($v -eq $expected) { Write-Output "PASS: LDAPServerIntegrity is $expected" } else { Write-Output "FAIL: expected $expected, got $v" }
      register: r_ldap
      changed_when: false
      ignore_errors: true
    - ansible.builtin.debug: { msg: "{{ r_ldap.stdout }}" }

- name: "PurpleForge | verify | EDR (Microsoft Defender Antivirus)"
  hosts: "dc01:ws01"
  gather_facts: false
  tasks:
    - name: "verify | Defender AV — real-time protection, network protection, tamper protection"
      ansible.windows.win_shell: |
        $pref = Get-MpPreference
        $tamper = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows Defender\Features' -Name TamperProtection -ErrorAction SilentlyContinue).TamperProtection
        $expectedNetProt = "Enabled"
        $expectedTamper = 5
        $ok = $true
        if ($pref.DisableRealtimeMonitoring) { Write-Output "FAIL: real-time monitoring is disabled"; $ok = $false }
        if ($pref.EnableNetworkProtection.ToString() -ne $expectedNetProt) { Write-Output "FAIL: expected EnableNetworkProtection=$expectedNetProt, got $($pref.EnableNetworkProtection)"; $ok = $false }
        if ($tamper -ne $expectedTamper) { Write-Output "FAIL: expected TamperProtection=$expectedTamper, got $tamper"; $ok = $false }
        if ($ok) { Write-Output "PASS: real-time monitoring on, network protection $expectedNetProt, tamper protection $expectedTamper" }
      register: r_defender
      changed_when: false
      ignore_errors: true
    - ansible.builtin.debug: { msg: "{{ r_defender.stdout_lines }}" }

    - name: "verify | Defender AV — ASR rules (expected action: audit)"
      ansible.windows.win_shell: |
        $pref = Get-MpPreference
        $expectedIds = @("56a863a9-875e-4185-98a7-b882c64b5ce5", "9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2", "d4f940ab-401b-4efc-aadc-ad5f3c50688a", "3b576869-a4ec-4529-8536-b80a7769e899", "75668c1f-73b5-4cf0-bb93-3ecf5cb7cc84", "d3e037e1-3eb8-44c8-a917-57927947596d", "92e97fa1-2edf-4476-bdd6-9dd0b4dddc7b")
        $expectedAction = "AuditMode"
        $ok = $true
        foreach ($id in $expectedIds) {
          $idx = [array]::IndexOf($pref.AttackSurfaceReductionRules_Ids, $id)
          if ($idx -lt 0) { Write-Output "FAIL: ASR rule $id not configured at all"; $ok = $false; continue }
          $actual = $pref.AttackSurfaceReductionRules_Actions[$idx].ToString()
          if ($actual -ne $expectedAction) { Write-Output "FAIL: ASR rule $id expected $expectedAction, got $actual"; $ok = $false }
        }
        if ($ok) { Write-Output "PASS: all ASR rules set to $expectedAction" }
      register: r_asr
      changed_when: false
      ignore_errors: true
    - ansible.builtin.debug: { msg: "{{ r_asr.stdout_lines }}" }

- name: "PurpleForge | verify | vuln 'asreproast' on dc01"
  hosts: "dc01"
  gather_facts: false
  tasks:
    - name: "verify | asreproast | DoesNotRequirePreAuth on Elizabeth_Feng"
      ansible.windows.win_shell: |
        $u = Get-ADUser -Identity "Elizabeth_Feng" -Properties DoesNotRequirePreAuth
        if ($u.DoesNotRequirePreAuth) { Write-Output "PASS: Elizabeth_Feng has DoesNotRequirePreAuth set" }
        else { Write-Output "FAIL: DoesNotRequirePreAuth not set on Elizabeth_Feng" }
      register: r_vuln
      changed_when: false
      ignore_errors: true
    - name: "verify | asreproast | result"
      ansible.builtin.debug:
        msg: "{{ r_vuln.stdout }}"
      when: r_vuln is defined

- name: "PurpleForge | verify | vuln 'kerberoasting' on dc01"
  hosts: "dc01"
  gather_facts: false
  tasks:
    - name: "verify | kerberoasting | SPN present on Elizabeth_Feng"
      ansible.windows.win_shell: |
        $u = Get-ADUser -Identity "Elizabeth_Feng" -Properties ServicePrincipalNames
        if ($u.ServicePrincipalNames -match "MSSQLSvc") { Write-Output "PASS: Elizabeth_Feng has an SPN" }
        else { Write-Output "FAIL: no MSSQLSvc SPN found on Elizabeth_Feng" }
      register: r_vuln
      changed_when: false
      ignore_errors: true
    - name: "verify | kerberoasting | result"
      ansible.builtin.debug:
        msg: "{{ r_vuln.stdout }}"
      when: r_vuln is defined

- name: "PurpleForge | verify | vuln 'dcsync-acl' on dc01"
  hosts: "dc01"
  gather_facts: false
  tasks:
    - name: "verify | dcsync-acl | replication ACE present for Elizabeth_Feng"
      ansible.windows.win_shell: |
        $domainDN = (Get-ADDomain).DistinguishedName
        $sid = (Get-ADUser -Identity "Elizabeth_Feng").SID
        $account = (New-Object System.Security.Principal.SecurityIdentifier($sid)).Translate([System.Security.Principal.NTAccount])
        $acl = Get-Acl -Path "AD:$domainDN"
        $found = $acl.Access | Where-Object { $_.IdentityReference -eq $account -and ($_.ObjectType -eq [GUID]'1131f6aa-9c07-11d1-f79f-00c04fc2dcd2' -or $_.ObjectType -eq [GUID]'1131f6ad-9c07-11d1-f79f-00c04fc2dcd2') }
        if ($found) { Write-Output "PASS: Elizabeth_Feng has a DS-Replication-Get-Changes[-All] ACE" }
        else { Write-Output "FAIL: no replication ACE found for Elizabeth_Feng" }
      register: r_vuln
      changed_when: false
      ignore_errors: true
    - name: "verify | dcsync-acl | result"
      ansible.builtin.debug:
        msg: "{{ r_vuln.stdout }}"
      when: r_vuln is defined

