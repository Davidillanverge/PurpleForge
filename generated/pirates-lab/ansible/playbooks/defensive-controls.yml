
---



- name: "PurpleForge | defensive-controls | EDR (defender-av, mode: enabled)"
  hosts: "dc01:ws01"
  gather_facts: false
  vars:
    pf_defender_av_mode: "enabled"

    pf_defender_av_settings:

      asr_rules: "audit"

      tamper_protection: true

      network_protection: true


  roles:
    - pf_defender_av


- name: "PurpleForge | defensive-controls | concrete controls (LAPS, LSA protection, SMB/LDAP signing, LLMNR/NBT-NS/mDNS, Protected Users)"
  hosts: "dc01:ws01"
  gather_facts: false
  vars:
    pf_controls_laps: true
    pf_controls_lsa_protection: true
    pf_controls_smb_signing: "enforce"
    pf_controls_ldap_signing: "enforce"
    pf_controls_disable_llmnr_nbtns_mdns: true
    pf_controls_credential_guard: false
    pf_controls_ntlmv2_only: true

    pf_controls_protected_users_group: []


    pf_controls_dc_hosts:

      - "dc01"


    pf_controls_laps_schema_host: "dc01"
  roles:
    - pf_controls


- name: "PurpleForge | defensive-controls | deception (2 honey account(s))"
  hosts: "dc01"
  gather_facts: false
  vars:

    pf_deception_honey_accounts:

      - "deckhand.1"

      - "deckhand.2"


  roles:
    - pf_deception

