---
# Vuln inject task-file: kerberoasting (T1558.003)
# Included by the generated vuln-injection.yml, run against the target domain's
# root DC (vars domain/domain_username/domain_password come from the inventory).
#
# Reuses Vulnerable-AD's VulnAD-Kerberoasting *technique* (a domain account with
# a registered SPN and a crackable password) but on a NAMED, deterministic
# account instead of Vulnerable-AD's random-user pick — random selection
# breaks PurpleForge invariants #5 (determinism, seed-driven) and idempotency.
# {{ vuln_kerberoast_account }} is either a fresh synthetic account
# (independent mode) or an existing real population object cast by
# resolve_attack_chain() (scripts/forge.py) in ctf mode — either way this
# task only resets its password + SPN, never identity fields (OU,
# description) win_domain_user wasn't given; ad-population.yml already set
# those for every population object. The weak password is what makes the
# roasted TGS crackable offline; it lives only in generated/<lab>/ (gitignored).
- name: "kerberoasting | reset {{ vuln_kerberoast_account }}'s password + SPN to make it kerberoastable"
  win_domain_user:
    name: "{{ vuln_kerberoast_account }}"
    password: "{{ vuln_kerberoast_password }}"
    password_never_expires: true
    spn:
      - "MSSQLSvc/{{ vuln_kerberoast_account }}.{{ domain }}:1433"
    spn_action: replace
    state: present
    domain_username: "{{ domain_username }}"
    domain_password: "{{ domain_password }}"
  register: vuln_kerberoast_result

# Verified on a real deploy (a fully-patched Windows Server 2016 image) that
# leaving msDS-SupportedEncryptionTypes unset — the traditional assumption
# for "this account is a weak/legacy kerberoastable target" — no longer
# makes an account kerberoastable at all on current cumulative updates: the
# KDC returned KDC_ERR_ETYPE_NOSUPP for EVERY principal in the domain,
# including this one and even Administrator, i.e. Microsoft's RC4
# deprecation work changed what "unset" effectively means. Explicitly
# setting it (28 = RC4_HMAC_MD5 + AES128 + AES256) is what actually made the
# account roastable again — RC4 in the mix keeps offline cracking fast (the
# point of this vuln), AES is included so the request still succeeds even if
# a given host has RC4 disabled entirely at the KDC/domain level.
- name: "kerberoasting | ensure {{ vuln_kerberoast_account }} actually supports being kerberoasted (RC4+AES ticket encryption)"
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param([String]$Account)
      Import-Module ActiveDirectory
      $u = Get-ADUser -Identity $Account -Properties msDS-SupportedEncryptionTypes
      if ($u.'msDS-SupportedEncryptionTypes' -ne 28) {
        Set-ADUser -Identity $Account -Replace @{'msDS-SupportedEncryptionTypes' = 28}
        $Ansible.Changed = $true
      } else {
        $Ansible.Changed = $false
      }
    parameters:
      Account: "{{ vuln_kerberoast_account }}"
  vars:
    ansible_become: yes
    ansible_become_method: runas
    ansible_become_user: "{{ domain_username }}"
    ansible_become_password: "{{ domain_password }}"

- name: "kerberoasting | record intended path"
  ansible.builtin.debug:
    msg: >-
      Kerberoasting gap live: any domain user can request a TGS for
      {{ vuln_kerberoast_account }} (SPN MSSQLSvc/...), the ticket is
      RC4/AES-encrypted with this account's weak password and crackable offline.
