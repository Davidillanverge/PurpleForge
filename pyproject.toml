[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purpleforge"
version = "0.1.0"
description = "Spec-driven harness that compiles a lab-spec.yml into Terraform + Ansible for isolated, Purple-Team-instrumented Active Directory labs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
# Pinned exactly (not ">="): invariant #5 promises byte-identical artifacts from
# the same spec+seed, and the renderer's output depends on the exact Jinja2 (and
# its MarkupSafe) version — a silent minor bump could change rendering BETWEEN
# deployers. constraints.txt pins the full transitive closure; install the
# reproducible set with `pip install -e ".[dev]" -c constraints.txt`.
dependencies = [
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
    "Jinja2==3.1.6",
    "ldap3==2.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "types-PyYAML==6.0.12.20260906",
    "types-jsonschema==4.26.0.20260518",
]

# `forge` on the PATH after `pip install -e .` — no more `python3 scripts/forge.py`.
# REPO_ROOT resolves from __file__, so an EDITABLE install is required (the
# harness reads catalog/, specs/, templates/ from the repo tree).
[project.scripts]
forge = "forge:main"

[tool.setuptools]
# `forge` is a package (scripts/forge/), `population` a top-level module
# (scripts/population.py) — matches the package's `from population import ...`.
packages = ["forge"]
py-modules = ["population"]

[tool.setuptools.package-dir]
"" = "scripts"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["vendor", "generated"]

[tool.ruff.lint]
# E501 (line-too-long) is intentionally off: the formatter owns wrapping, and
# the catalog/help strings are deliberately long. Everything else is real signal.
select = ["F", "I", "W", "UP", "B", "C4", "E4", "E7", "E9"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
files = ["scripts"]
ignore_missing_imports = true
# Pragmatic baseline for a large existing module: check what's annotated, don't
# force annotations on every helper yet (that tightens as forge.py is split up).
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["vendor", "generated"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["scripts"]
