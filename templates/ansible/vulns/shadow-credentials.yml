---
# Vuln inject task-file: shadow-credentials (T1098.005)
# Creates a NAMED, deterministic privileged target account
# ({{ vuln_shadowcred_target }}, a Domain Admin — kept distinct from the
# real domain Administrator so this vuln's blast radius is self-contained
# and clearly labeled) and grants {{ vuln_shadowcred_writer_group }}
# (a real, built-in group by default — "Domain Users") WriteProperty on its
# msDS-KeyCredentialLink attribute — the Shadow Credentials / Whisker
# misconfiguration: anyone in that group can add their own key credential
# and authenticate as the target via PKINIT without ever touching its
# password.
- name: "shadow-credentials | create privileged target account {{ vuln_shadowcred_target }}"
  win_domain_user:
    name: "{{ vuln_shadowcred_target }}"
    firstname: Tier0
    surname: Admin
    description: "Privileged application administrator (Tier 0)"
    password: "{{ vuln_shadowcred_target_password }}"
    password_never_expires: true
    groups:
      - Domain Admins
    state: present
    domain_username: "{{ domain_username }}"
    domain_password: "{{ domain_password }}"

- name: "shadow-credentials | grant {{ vuln_shadowcred_writer_group }} WriteProperty on {{ vuln_shadowcred_target }}'s msDS-KeyCredentialLink"
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param([String]$TargetAccount, [String]$WriterGroup)
      $dn = (Get-ADUser -Identity $TargetAccount).DistinguishedName
      $domainNb = (Get-ADDomain).NetBIOSName
      $before = & dsacls.exe $dn 2>&1 | Out-String
      & dsacls.exe $dn /G "$($domainNb)\$($WriterGroup):WP;msDS-KeyCredentialLink" | Out-Null
      $after = & dsacls.exe $dn 2>&1 | Out-String
      $Ansible.Changed = ($before -ne $after)
    parameters:
      TargetAccount: "{{ vuln_shadowcred_target }}"
      WriterGroup: "{{ vuln_shadowcred_writer_group }}"
  vars:
    ansible_become: yes
    ansible_become_method: runas
    ansible_become_user: "{{ domain_username }}"
    ansible_become_password: "{{ domain_password }}"

- name: "shadow-credentials | record intended path"
  ansible.builtin.debug:
    msg: >-
      Shadow Credentials gap live: any member of
      {{ vuln_shadowcred_writer_group }} can add a key credential to
      {{ vuln_shadowcred_target }} (Domain Admins) and authenticate as it
      via PKINIT (e.g. Whisker/Certipy shadow auto), without ever knowing
      or changing its password.
