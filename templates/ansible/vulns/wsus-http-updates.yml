---
# Vuln inject task-file: wsus-http-updates (T1557, T1195.002)
# service-provisioning.yml already installed WSUS SECURELY on this host
# ({{ inventory_hostname }}, services: [wsus]): HTTPS/8531, SSL required on the
# client vdirs. This task is the gap: drop the client-facing endpoints back to
# plain HTTP/8530 (SSL not required) and point the WindowsUpdate client policy at
# http://<wsus>:8530, so update traffic is interceptable/relayable (PyWSUS). The
# NTFS/registry writes are idempotent (win_regedit flips only on change;
# Set-WebConfigurationProperty converges).
- name: "wsus-http-updates | drop SSL requirement on the WSUS client-facing vdirs (serve HTTP/8530)"
  ansible.windows.win_shell: |
    Import-Module WebAdministration
    foreach ($vdir in 'ApiRemoting30','ClientWebService','DssAuthWebService','ServerSyncWebService','SimpleAuthWebService','Content','Inventory') {
        $p = "IIS:\Sites\WSUS Administration\$vdir"
        if (Test-Path $p) { Set-WebConfigurationProperty -PSPath $p -Filter 'system.webServer/security/access' -Name sslFlags -Value 'None' -ErrorAction SilentlyContinue }
    }
  changed_when: true

- name: "wsus-http-updates | point the WindowsUpdate client policy at the cleartext HTTP WSUS (8530)"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: "{{ item.type }}"
  loop:
    - { name: WUServer, data: "http://{{ inventory_hostname }}:8530", type: string }
    - { name: WUStatusServer, data: "http://{{ inventory_hostname }}:8530", type: string }
    - { name: UseHttps, data: 0, type: dword }
  loop_control:
    label: "{{ item.name }}"

- name: "wsus-http-updates | enable the 'use WSUS' client policy so the HTTP endpoint is honored"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
    name: UseWUServer
    data: 1
    type: dword

- name: "wsus-http-updates | restart the WSUS service so the transport change applies"
  ansible.windows.win_service:
    name: WsusService
    state: restarted

- name: "wsus-http-updates | record intended path"
  ansible.builtin.debug:
    msg: >-
      WSUS HTTP-updates gap live on {{ inventory_hostname }}: WSUS serves clients
      over cleartext HTTP/8530 (SSL dropped, WUServer=http, UseHttps=0) -> a
      network attacker MITM/relays update traffic (PyWSUS) to push a malicious
      signed-wrapper update and run commands as SYSTEM on the clients.
