---
# Vuln inject task-file: autologon-credentials (T1552.002)
# PurpleForge-authored, OS-level credential exposure (no AD artifact). Lands on
# a workstation (target_role: workstation). Enables interactive auto-logon with
# the account password stored in CLEARTEXT in the Winlogon registry key, which
# any user can read. Idempotent: win_regedit only reports changed on a real flip.
- name: "autologon-credentials | enable AutoAdminLogon"
  ansible.windows.win_regedit:
    path: "HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon"
    name: AutoAdminLogon
    data: "1"
    type: string

- name: "autologon-credentials | set the cleartext DefaultPassword + account"
  ansible.windows.win_regedit:
    path: "HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon"
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: string
  loop:
    - { name: DefaultUserName, data: "{{ vuln_autologon_account }}" }
    - { name: DefaultPassword, data: "{{ vuln_autologon_password }}" }
    - { name: DefaultDomainName, data: "{{ member_domain | default('.') }}" }
  loop_control:
    label: "{{ item.name }}"

- name: "autologon-credentials | record intended path"
  ansible.builtin.debug:
    msg: >-
      Autologon cleartext-credential gap live on {{ inventory_hostname }}:
      AutoAdminLogon=1 with DefaultPassword stored in cleartext in Winlogon for
      {{ vuln_autologon_account }} -> any user reads the key and lifts the
      credential.
