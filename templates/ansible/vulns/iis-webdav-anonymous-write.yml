---
# Vuln inject task-file: iis-webdav-anonymous-write (T1190, T1505.003)
# service-provisioning.yml already installed IIS SECURELY on this host
# ({{ inventory_hostname }}, services: [iis]): WebDAV absent, anonymous auth
# read-only. This task is the actual gap — install the WebDAV role, enable it on
# the Default Web Site, and author a rule granting anonymous WRITE to wwwroot so
# an unauthenticated PUT can drop an .aspx webshell. Idempotent: win_feature and
# the Set-WebConfigurationProperty / appcmd settings converge on re-runs.
- name: "iis-webdav-anonymous-write | install the WebDAV publishing role"
  ansible.windows.win_feature:
    name: Web-DAV-Publishing
    state: present
    include_management_tools: true
  register: webdav_feature

- name: "iis-webdav-anonymous-write | reboot if the feature install requires it"
  ansible.windows.win_reboot:
  when: webdav_feature.reboot_required | default(false)

- name: "iis-webdav-anonymous-write | unlock the WebDAV config sections (locked at apphost by default)"
  ansible.windows.win_shell: >-
    & "$env:windir\system32\inetsrv\appcmd.exe" unlock config /section:system.webServer/webdav/authoring;
    & "$env:windir\system32\inetsrv\appcmd.exe" unlock config /section:system.webServer/webdav/authoringRules
  changed_when: false
  # A fresh Web-DAV-Publishing install locks these sections
  # (overrideModeDefault="Deny") at applicationHost.config, so a site-level
  # Set-WebConfigurationProperty / appcmd set against them fails with "This
  # configuration section cannot be used at this path" until unlocked. appcmd
  # unlock is idempotent (re-unlocking an unlocked section is a no-op success).

- name: "iis-webdav-anonymous-write | enable WebDAV on the Default Web Site"
  ansible.windows.win_shell: >-
    Import-Module WebAdministration;
    Set-WebConfigurationProperty -PSPath 'IIS:\Sites\Default Web Site'
    -Filter 'system.webServer/webdav/authoring' -Name enabled -Value $true
  changed_when: false

- name: "iis-webdav-anonymous-write | ensure the HTTP PUT verb is not denied by request filtering"
  ansible.windows.win_shell: >-
    Import-Module WebAdministration;
    $p = 'IIS:\Sites\Default Web Site';
    $f = 'system.webServer/security/requestFiltering/verbs';
    if (Get-WebConfiguration -PSPath $p -Filter "$f/add[@verb='PUT']") {
    Remove-WebConfigurationProperty -PSPath $p -Filter $f -Name '.' -AtElement @{verb='PUT'} }
  changed_when: false
  # Default IIS request filtering does not block PUT; this removes any explicit
  # PUT deny (e.g. one left by iis_hardening) so the gap does not depend on it.

- name: "iis-webdav-anonymous-write | author rule: anonymous read/write/source on wwwroot"
  ansible.windows.win_shell: >-
    & "$env:windir\system32\inetsrv\appcmd.exe" set config "Default Web Site"
    /section:system.webServer/webdav/authoringRules
    /+"[users='*',path='*',access='Read, Write, Source']"
    /commit:apphost
  register: webdav_rule
  changed_when: "'applied configuration changes' in (webdav_rule.stdout | lower) or webdav_rule.rc == 0"
  failed_when: webdav_rule.rc != 0 and 'cannot add duplicate' not in (webdav_rule.stdout | lower)
  # idempotent: appcmd returns a "cannot add duplicate collection entry" error
  # on re-run once the rule exists — treated as success, not a failure.

- name: "iis-webdav-anonymous-write | ensure anonymous authentication stays enabled"
  ansible.windows.win_shell: >-
    Import-Module WebAdministration;
    Set-WebConfigurationProperty -PSPath 'IIS:\Sites\Default Web Site'
    -Filter 'system.webServer/security/authentication/anonymousAuthentication' -Name enabled -Value $true
  changed_when: false

- name: "iis-webdav-anonymous-write | grant the anonymous IIS identity NTFS write on the web root (the gap)"
  ansible.windows.win_acl:
    path: C:\inetpub\wwwroot
    user: IIS_IUSRS
    rights: Modify
    type: allow
    state: present
    inherit: ContainerInherit, ObjectInherit
    propagation: None
  # WebDAV authorizes the write at the config layer, but the NTFS ACL on wwwroot
  # grants IIS_IUSRS only Read+Execute by default — without this the anonymous PUT
  # gets HTTP 401 (confirmed live). This is the filesystem half of the gap.

- name: "iis-webdav-anonymous-write | restart IIS so the WebDAV module loads"
  ansible.windows.win_shell: iisreset /restart
  changed_when: true

- name: "iis-webdav-anonymous-write | record intended path"
  ansible.builtin.debug:
    msg: >-
      IIS WebDAV anonymous-write gap live on {{ inventory_hostname }}: WebDAV
      installed + enabled with an anonymous Read/Write/Source authoring rule on
      the Default Web Site -> an unauthenticated attacker PUTs an .aspx webshell
      and GETs it for RCE as the app pool identity.
