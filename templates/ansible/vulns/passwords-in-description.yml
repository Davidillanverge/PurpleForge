---
# Vuln inject task-file: passwords-in-description (T1552)
# Reuses Vulnerable-AD's VulnAD-PwdInObjectDescription technique (a cleartext
# password in a user's LDAP description, readable by any authenticated user) on
# a NAMED deterministic account rather than a random one.
#
# {{ vuln_pwddesc_account }} is either a fresh synthetic account (independent
# mode) or an existing real population object cast by resolve_attack_chain()
# (scripts/forge.py) in ctf mode — either way this task resets its password
# AND overwrites its description (unlike every other vuln template here,
# description IS the vulnerability, so it's the one identity field this task
# deliberately still sets, replacing whatever ad-population.yml gave it).
- name: "passwords-in-description | reset {{ vuln_pwddesc_account }}'s password and leak it via description"
  win_domain_user:
    name: "{{ vuln_pwddesc_account }}"
    description: "Temp account - password is {{ vuln_pwddesc_password }}"
    password: "{{ vuln_pwddesc_password }}"
    password_never_expires: true
    state: present
    domain_username: "{{ domain_username }}"
    domain_password: "{{ domain_password }}"

- name: "passwords-in-description | record intended path"
  ansible.builtin.debug:
    msg: >-
      Password-in-description gap live: {{ vuln_pwddesc_account }}'s LDAP
      description field leaks its real password to any authenticated user.
