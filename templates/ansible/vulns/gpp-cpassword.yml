---
# Vuln inject task-file: gpp-cpassword (T1552.006)
# No upstream primitive (Vulnerable-AD/GOAD don't do GPP), so PurpleForge-authored.
# Creates a real GPO and drops a Groups.xml carrying the pre-MS14-025 `cpassword`
# attribute into its SYSVOL Preferences path. cpassword is AES-256 encrypted with
# the key Microsoft published in MSDN, so any authenticated user can read
# Groups.xml from SYSVOL and decrypt it offline (gpp-decrypt). The value below
# decrypts to "Local*8!". Runs on the target domain's root DC (owns SYSVOL).
- name: "gpp-cpassword | ensure GPO '{{ vuln_gpp_name }}' exists"
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param([String]$GpoName)
      Import-Module GroupPolicy
      $gpo = Get-GPO -Name $GpoName -ErrorAction SilentlyContinue
      if (-not $gpo) {
        $gpo = New-GPO -Name $GpoName
        $Ansible.Changed = $true
      } else {
        $Ansible.Changed = $false
      }
      $Ansible.Result = @{ guid = "{$($gpo.Id.ToString().ToUpper())}"; domain = (Get-ADDomain).DNSRoot }
    parameters:
      GpoName: "{{ vuln_gpp_name }}"
  vars:
    ansible_become: yes
    ansible_become_method: runas
    ansible_become_user: "{{ domain_username }}"
    ansible_become_password: "{{ domain_password }}"
  register: vuln_gpp_gpo

- name: "gpp-cpassword | create the GPP Groups preferences folder in SYSVOL"
  win_file:
    path: "\\\\{{ vuln_gpp_gpo.result.domain }}\\SYSVOL\\{{ vuln_gpp_gpo.result.domain }}\\Policies\\{{ vuln_gpp_gpo.result.guid }}\\Machine\\Preferences\\Groups"
    state: directory
  vars:
    ansible_become: yes
    ansible_become_method: runas
    ansible_become_user: "{{ domain_username }}"
    ansible_become_password: "{{ domain_password }}"

- name: "gpp-cpassword | write Groups.xml with the cpassword (decrypts to Local*8!)"
  win_copy:
    dest: "\\\\{{ vuln_gpp_gpo.result.domain }}\\SYSVOL\\{{ vuln_gpp_gpo.result.domain }}\\Policies\\{{ vuln_gpp_gpo.result.guid }}\\Machine\\Preferences\\Groups\\Groups.xml"
    content: |
      <?xml version="1.0" encoding="utf-8"?>
      <Groups clsid="{3125E937-EB16-4b4c-9934-544FC6D24D26}">
        <User clsid="{DF5F1855-51E5-4d24-8B1A-D9BDE98BA1D1}" name="Administrator (built-in)" image="2" changed="2015-02-18 00:00:00" uid="{D5FE7352-81E1-42A2-B7DA-118402BE4C33}">
          <Properties action="U" newName="" fullName="" description="" cpassword="j1Uyj3Vx8TY9LtLZil2uAuZkFQA/4latT76ZwgdHdhw" changeLogon="0" noChange="1" neverExpires="1" acctDisabled="0" userName="Administrator (built-in)"/>
        </User>
      </Groups>
  vars:
    ansible_become: yes
    ansible_become_method: runas
    ansible_become_user: "{{ domain_username }}"
    ansible_become_password: "{{ domain_password }}"

- name: "gpp-cpassword | record intended path"
  ansible.builtin.debug:
    msg: >-
      GPP cpassword gap live: Groups.xml under SYSVOL for GPO '{{ vuln_gpp_name }}'
      carries a cpassword any authenticated user can read and decrypt offline.
