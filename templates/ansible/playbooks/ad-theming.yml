---
# PurpleForge — ad-theming playbook.
# Population itself is 100% vendor/BadBlood (Invoke-BadBlood.ps1 and friends),
# unmodified — see .claude/skills/ad-theming/SKILL.md for how theming and
# determinism are achieved purely through the files this playbook stages
# (Names/*.txt + 3lettercodes.csv rendered from catalog/themes/<theme>.yml by
# scripts/forge.py) and a `Get-Random -SetSeed` call, with no fork of
# BadBlood's own scripts. Only the final "theme-specific groups" step is
# PurpleForge-authored (ad_theming_overlay role) — BadBlood has no concept of
# it.
#
# Runs once per domain, against that domain's root DC (never against
# domain_controllers_additional — BadBlood populates the domain as a whole,
# any single DC sees the same directory).

- name: PurpleForge | ad-theming | stage themed BadBlood and populate each domain
  hosts: domain_controllers:child_domain_controllers
  gather_facts: false
  tasks:
    - name: Copy the (already-themed) BadBlood tree to the DC
      win_copy:
        src: "{{ playbook_dir }}/../files/badblood/"
        dest: "C:\\BadBlood\\"

    - name: "Populate the domain via BadBlood (seeded, {{ badblood_user_count }} users / {{ badblood_group_count }} groups / {{ badblood_computer_count }} computers)"
      ansible.windows.win_powershell:
        script: |
          [CmdletBinding()]
          param(
              [int]$Seed,
              [int]$UserCount,
              [int]$GroupCount,
              [int]$ComputerCount
          )
          Get-Random -SetSeed $Seed | Out-Null
          & 'C:\BadBlood\Invoke-BadBlood.ps1' -UserCount $UserCount -GroupCount $GroupCount -ComputerCount $ComputerCount -NonInteractive -SkipLapsInstall
          # -SkipLapsInstall: LAPS is a hardening control owned by the
          # defensive-controls skill (defense.hardening.controls.laps), not
          # ad-theming — don't let BadBlood's own LAPS schema install race
          # with it.
        parameters:
          Seed: "{{ badblood_seed }}"
          UserCount: "{{ badblood_user_count }}"
          GroupCount: "{{ badblood_group_count }}"
          ComputerCount: "{{ badblood_computer_count }}"

  roles:
    - ad_theming_overlay
