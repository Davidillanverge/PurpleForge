---
# PurpleForge BAS agent: MITRE Caldera "sandcat" (54ndc47) beacon.
# Downloads + installs ONE sandcat agent that beacons back to the operator's
# Caldera server and joins a group. This role only lands + persists the agent; it
# does NOT create operations, abilities or adversaries — the operator drives the
# emulation from the Caldera server. The server runs wherever the operator put it:
#   * a CLOUD Caldera  -> agents reach it by egress through the WireGuard bastion
#     (NAT), so PF_CALDERA_SERVER is its public/routable URL.
#   * a LOCAL KALI Caldera -> the Kali box is the WireGuard peer, so set
#     PF_CALDERA_SERVER to the Kali address the lab subnets can reach over the
#     tunnel (its WireGuard interface IP, e.g. http://10.x.x.x:8888). See
#     BAS-DEPLOY-RUNBOOK.md for picking the right address.
#
# Backend inputs are deploy-time extra-vars (NOT in the spec, not seed-derived):
#   pf_caldera_server   (required)  base URL incl. scheme+port, e.g. http://host:8888
#   pf_caldera_group    (required)  sandcat group to join, e.g. red
#   pf_caldera_api_key  (optional)  only if your download endpoint is auth-gated;
#                                   the default sandcat beacon does not need it.
#
# Microsoft Defender flags compiled sandcat as a known offensive tool and will
# quarantine the installer/agent on write/run, so this role adds the AV exclusions
# BEFORE downloading (invariant #2 PREVENT is deliberately relaxed here for the BAS
# agent, same spirit as a telemetry agent install). Tamper Protection still allows
# adding exclusions; disabling real-time protection is NOT done.
#
# LIVE-VALIDATED 2026-10-04 on AWS (Windows Server 2022, dc01+mbr01) against a
# local-Kali Caldera over the WireGuard tunnel: sandcat downloaded, persisted and
# beaconing, with Defender real-time protection restored afterwards. The download
# headers and sandcat flags track Caldera's current sandcat plugin; verify against
# your server version. Idempotent: skips the download when the PFCalderaSandcat
# task already exists.
- name: "pf_caldera_agent | require the Caldera enrollment inputs (deploy-time env)"
  ansible.builtin.assert:
    that:
      - pf_caldera_server | default('') | length > 0
      - pf_caldera_group | default('') | length > 0
    fail_msg: >-
      Caldera sandcat needs PF_CALDERA_SERVER and PF_CALDERA_GROUP passed as
      extra-vars at deploy (operator-provided C2 server — cloud or local Kali).
      Neither is baked into the spec.

- name: "pf_caldera_agent | normalise the server URL + build download headers"
  ansible.builtin.set_fact:
    pf_caldera_server_url: "{{ pf_caldera_server | regex_replace('/+$', '') }}"
    # sandcat download headers select the platform/file; the optional KEY header
    # (Caldera api_key) is folded in only when set. Built as a VALUE dict — Ansible
    # does NOT template dict KEYS, so a Jinja expression used as a header name would
    # be sent literally and rejected as invalid HTTP header characters.
    pf_caldera_headers: >-
      {{ {'platform': 'windows', 'file': 'sandcat.go'}
         | combine({'KEY': pf_caldera_api_key} if (pf_caldera_api_key | default('') | length > 0) else {}) }}

- name: "pf_caldera_agent | add Defender AV exclusions BEFORE download (else it quarantines sandcat)"
  ansible.windows.win_shell: |
    Add-MpPreference -ExclusionPath 'C:\setup\caldera' -ErrorAction SilentlyContinue
    Add-MpPreference -ExclusionProcess 'sandcat.exe' -ErrorAction SilentlyContinue
    exit 0
  changed_when: true
  failed_when: false

- name: "pf_caldera_agent | check whether the sandcat scheduled task already exists"
  ansible.windows.win_shell: "if (Get-ScheduledTask -TaskName 'PFCalderaSandcat' -ErrorAction SilentlyContinue) { 'present' } else { 'absent' }"
  register: pf_cal_task
  changed_when: false

- name: "pf_caldera_agent | create the setup directory"
  ansible.windows.win_file:
    path: C:\setup\caldera
    state: directory
  when: "'present' not in (pf_cal_task.stdout | default(''))"

# A path/process exclusion is NOT enough for the DOWNLOAD itself: real-time
# protection + Block-At-First-Sight scan the content stream (staged in a temp file
# outside the excluded path) and quarantine the known sandcat signature mid-write.
# Tamper Protection is off in this baseline, so briefly disable real-time
# monitoring for the download only, in a block whose `always` re-enables it even on
# failure. The persistent path/process exclusions (set above) keep the enrolled
# agent alive once real-time is back on.
- name: "pf_caldera_agent | download sandcat with real-time AV paused (restored no matter what)"
  when: "'present' not in (pf_cal_task.stdout | default(''))"
  block:
    - name: "pf_caldera_agent | pause Defender real-time monitoring for the download"
      ansible.windows.win_shell: "Set-MpPreference -DisableRealtimeMonitoring $true; exit 0"
      changed_when: true

    - name: "pf_caldera_agent | download the sandcat agent straight into the AV-excluded dir"
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $h = @{ 'platform' = 'windows'; 'file' = 'sandcat.go' }
        {% if (pf_caldera_api_key | default('')) | length > 0 %}$h['KEY'] = '{{ pf_caldera_api_key }}'
        {% endif %}Invoke-WebRequest -UseBasicParsing -Uri '{{ pf_caldera_server_url }}/file/download' -Headers $h -OutFile 'C:\setup\caldera\sandcat.exe' -TimeoutSec 90
        if ((Test-Path 'C:\setup\caldera\sandcat.exe') -and ((Get-Item 'C:\setup\caldera\sandcat.exe').Length -gt 0)) { 'PF-DL-OK' } else { throw 'sandcat not written' }
      register: pf_cal_dl
      # Download DIRECTLY into C:\setup\caldera, which was added to Defender's
      # exclusions above. The old win_get_url staged the stream through %TEMP% (NOT
      # excluded), so Block-At-First-Sight quarantined sandcat there whenever EDR
      # ran with tamper_protection=true (real-time can't be paused under TP, so the
      # download failed with "the file contains a virus"). A direct -OutFile write
      # into the excluded path is never scanned -> works with tamper protection ON.
      # Still strictly best-effort: BAS must NEVER fail the deploy, so swallow every
      # error (transient Caldera unreachability, or a host where exclusions did not
      # take) and skip the install below, gated on the file actually existing. On
      # such hosts, enroll the beacon post-deploy — see BAS-DEPLOY-RUNBOOK.md.
      changed_when: "'PF-DL-OK' in (pf_cal_dl.stdout | default(''))"
      failed_when: false
      retries: 3
      delay: 15
      until: "'PF-DL-OK' in (pf_cal_dl.stdout | default(''))"
  always:
    - name: "pf_caldera_agent | re-enable Defender real-time monitoring"
      ansible.windows.win_shell: "Set-MpPreference -DisableRealtimeMonitoring $false; exit 0"
      changed_when: true
      failed_when: false

# Did the agent actually land? On a host where Defender (with tamper protection)
# quarantined the download, the file is absent — skip the install/start/verify
# below so the host stays green and the deploy still completes + snapshots,
# instead of registering a scheduled task that points at a missing binary.
- name: "pf_caldera_agent | check whether the sandcat binary landed"
  ansible.windows.win_stat:
    path: C:\setup\caldera\sandcat.exe
  register: pf_cal_exe

- name: "pf_caldera_agent | note when the beacon could not be staged (Defender/transient — non-fatal)"
  ansible.builtin.debug:
    msg: >-
      PF-BAS-SKIPPED sandcat not staged on {{ inventory_hostname }} (Defender
      quarantine under tamper protection, or Caldera unreachable) — host left
      green; enroll the beacon post-deploy. See BAS-DEPLOY-RUNBOOK.md.
  when:
    - "'present' not in (pf_cal_task.stdout | default(''))"
    - not (pf_cal_exe.stat.exists | default(false))

# Persist as an at-boot SYSTEM scheduled task (survives reboot -> part of the
# baseline the clean snapshot captures) AND kick it off now so it is already
# beaconing when the snapshot is taken.
- name: "pf_caldera_agent | register the sandcat agent as an at-boot SYSTEM task"
  when: pf_cal_exe.stat.exists | default(false) or ('present' in (pf_cal_task.stdout | default('')))
  community.windows.win_scheduled_task:
    name: PFCalderaSandcat
    description: "PurpleForge BAS — MITRE Caldera sandcat beacon (group {{ pf_caldera_group }})"
    actions:
      - path: C:\setup\caldera\sandcat.exe
        arguments: "-server {{ pf_caldera_server_url }} -group {{ pf_caldera_group }} -v"
    triggers:
      - type: boot
    username: SYSTEM
    run_level: highest
    state: present
    enabled: true

- name: "pf_caldera_agent | start the sandcat agent now (begin beaconing)"
  ansible.windows.win_shell: "Start-ScheduledTask -TaskName 'PFCalderaSandcat'"
  register: pf_cal_start
  changed_when: true
  failed_when: pf_cal_start.rc != 0
  when: pf_cal_exe.stat.exists | default(false) or ('present' in (pf_cal_task.stdout | default('')))

- name: "pf_caldera_agent | verify the sandcat process is running (best-effort, retries)"
  ansible.windows.win_shell: "if (Get-Process -Name 'sandcat' -ErrorAction SilentlyContinue) { 'running' } else { 'not-running' }"
  register: pf_cal_proc
  changed_when: false
  failed_when: false
  retries: 8
  delay: 10
  until: "'running' in (pf_cal_proc.stdout | default(''))"
  when: pf_cal_exe.stat.exists | default(false) or ('present' in (pf_cal_task.stdout | default('')))

- name: "pf_caldera_agent | record state"
  ansible.builtin.debug:
    msg: >-
      Caldera sandcat enrolled on {{ inventory_hostname }} -> server
      {{ pf_caldera_server_url }} (group {{ pf_caldera_group }}). Beacon check:
      {{ 'RUNNING' if 'running' in (pf_cal_proc.stdout | default('')) else 'NOT-yet-seen — confirm the agent appears in the Caldera UI' }}.
