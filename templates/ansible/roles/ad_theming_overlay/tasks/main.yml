---
# PurpleForge-authored curation layer on top of BadBlood's own output — there
# is no upstream equivalent for this (BadBlood has no concept of "extra
# groups"). Creates the theme's extra_groups (see catalog/themes/*.yml) as
# security groups directly under the domain root, after BadBlood has already
# populated the tiered OU skeleton. Idempotent: win_domain_group already
# no-ops if the group exists.
- name: "Create theme-specific groups ({{ ad_theming_extra_groups | map(attribute='name') | join(', ') }})"
  win_domain_group:
    name: "{{ item.name }}"
    scope: global
    category: security
    description: "{{ item.description }}"
    state: present
    domain_username: "{{ domain_username }}"
    domain_password: "{{ domain_password }}"
  loop: "{{ ad_theming_extra_groups }}"
