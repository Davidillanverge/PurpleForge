# PurpleForge — Avengers-themed Azure purple lab.
# Topology + infra + defense only. Vulnerabilities and the CTF attack chain are
# filled in by the lab-designer agent (vulnerabilities: [] for now).
#
# SIZING / QUOTA (see AZURE-DEPLOY-RUNBOOK.md):
#   This subscription has a HARD 4-total-vCPU-per-region quota in eastus.
#   Standard_F1as_v7 (1 vCPU) is the only unrestricted SKU here, so every VM
#   must be 1 vCPU. Budget: DC (1) + workstation (1) + WireGuard bastion (1) = 3
#   vCPU, leaving 1 vCPU of headroom. NO member-server (would blow the cap and
#   there is no ADCS in this lab by design).
lab:
  name: avengers-lab
  theme: avengers
  provider: azure
  region: eastus   # hard 4-total-vCPU-per-region quota on this subscription; Standard_F1as_v7 (1 vCPU) is the only unrestricted SKU here — DC + workstation + WireGuard bastion must fit in 4 vCPU. See AZURE-DEPLOY-RUNBOOK.md
  isolation: vpn-only
  auto_shutdown: "20:00 Europe/Madrid"
  budget_alert_usd: 60

forest:
  - domain: shield.local
    netbios: SHIELD
    functional_level: "2016"
    domain_controllers: 1

machines:
  - role: domain-controller
    # Server 2019 (not 2016): the target subscription only offers NVMe-only VM
    # sizes (Fasv7), and the Server 2016 image is SCSI-only so it cannot boot on
    # them. Domain functional_level stays 2016 below. See AZURE-DEPLOY-RUNBOOK.md.
    os: windows-server-2019
    domain: shield.local
    count: 1
  - role: workstation
    os: windows-10-22h2
    domain: shield.local
    count: 1

population:
  users: 25
  density: sparse
  seed: 616

# =============================================================================
# CTF ATTACK-CHAIN DESIGN — 3 coherent foothold -> escalation -> Domain Admin paths
# -----------------------------------------------------------------------------
# attack_chain.mode: ctf (below) makes resolve_attack_chain() reuse the SAME real
# population objects across compatible steps, so exploiting step N is a genuine
# prerequisite for step N+1. The spec has no multi-chain field; the three chains
# are expressed via ctf mode + this documented design. All 8 vulns are
# service-free (requires_services: []) and valid on the DC + workstation topology
# (no member-server, so adcs-esc1 is intentionally NOT selected).
#
# ---- Chain A · "Black Widow" — unauth foothold -> offline crack -> domain dominance
#   1. asreproast              T1558.004  Steal/Forge Kerberos Tickets: AS-REP Roasting
#        No creds needed: request AS-REP for a DONT_REQ_PREAUTH account, crack offline.
#   2. kerberoasting           T1558.003  Steal/Forge Kerberos Tickets: Kerberoasting
#        Now authenticated, request a TGS for an SPN account, crack its weak password.
#   3. dcsync-acl              T1003.006  OS Credential Dumping: DCSync
#        That over-privileged account holds replication rights -> DCSync krbtgt -> DA.
#   Objective: Domain Admin / full SHIELD.LOCAL compromise (dump krbtgt, golden ticket).
#
# ---- Chain B · "Hydra" — loot creds -> abuse delegation
#   1. passwords-in-description T1552     Unsecured Credentials (password in LDAP description)
#        Any authenticated user LDAP-reads a cleartext password from an account desc.
#   2. gpp-cpassword           T1552.006  Unsecured Credentials: Group Policy Preferences
#        Decrypt the SYSVOL GPP cPassword -> valid local Administrator credential.
#   3. unconstrained-delegation T1187 (+T1558.003) Forced Authentication -> TGT capture
#        Land on the unconstrained-delegation host, coerce a DC to auth, cache its
#        TGT in LSASS, extract it -> impersonate the DC -> DA.
#   Objective: Domain Admin via captured DC TGT.
#
# ---- Chain C · "Ultron" — forge auth -> DNS to DA
#   1. shadow-credentials      T1098.005  Account Manipulation: Device Registration
#        Low-priv group can write msDS-KeyCredentialLink on a Tier-0 account ->
#        add own key, PKINIT as that account without touching its password.
#   2. dnsadmins-privesc       T1574.002  Hijack Execution Flow: DLL Side-Loading
#        That account is in DnsAdmins -> ServerLevelPluginDll loads an attacker DLL
#        as SYSTEM on the DC -> code execution as SYSTEM on the domain controller.
#   Objective: SYSTEM on the DC / Domain Admin via DnsAdmins DLL load.
# =============================================================================
vulnerabilities:
  # Chain A · Black Widow
  - asreproast
  - kerberoasting
  - dcsync-acl
  # Chain B · Hydra
  - passwords-in-description
  - gpp-cpassword
  - unconstrained-delegation
  # Chain C · Ultron
  - shadow-credentials
  - dnsadmins-privesc

attack_chain:
  mode: ctf

defense:
  profile: realistic
    # NOTE: baseline-controls (not cis-l1) — keeps hardening OS-agnostic (only the
    # individual hardening.controls.* toggles, no ansible-lockdown CIS/STIG role).
    # The realistic profile's other defaults still apply.
  hardening:
    baseline: baseline-controls
    apply_to: all
    controls:
      laps: true
    intentional_gaps_auto: true
  edr:
    - product: defender-av
      mode: enabled
      settings: { asr_rules: audit, tamper_protection: true, network_protection: true }
      targets: all
  deception:
    honey_accounts: 2

on_conflict: exclude-control

validation:
  bloodhound: true
  pingcastle: true
  atomic_red_team:
    - T1558.004   # asreproast
    - T1558.003   # kerberoasting
    - T1003.006   # dcsync-acl
    - T1552.006   # gpp-cpassword
    - T1187       # unconstrained-delegation
    # skipped (validate.atomic: null): passwords-in-description, shadow-credentials, dnsadmins-privesc
