# PurpleForge — Pirates of the Caribbean-themed Azure purple lab.
# Topology + infra + defense, and a single fully-authored 3-step CTF chain
# (this lab has only ONE domain and NO member-server, so unlike
# avengers-lab-azure.yml there is exactly one chain, not three).
#
# SIZING / QUOTA (see AZURE-DEPLOY-RUNBOOK.md):
#   This subscription has a HARD 4-total-vCPU-per-region quota in eastus.
#   Standard_F1as_v7 (1 vCPU) is the only unrestricted SKU here, so every VM
#   must be 1 vCPU. Budget: DC (1) + workstation (1) + WireGuard bastion (1) = 3
#   vCPU, leaving 1 vCPU of headroom. NO member-server (would blow the cap and
#   there is no ADCS in this lab by design).
lab:
  name: pirates-lab
  theme: pirates-caribbean
  provider: azure
  region: eastus   # hard 4-total-vCPU-per-region quota on this subscription; Standard_F1as_v7 (1 vCPU) is the only unrestricted SKU here — DC + workstation + WireGuard bastion must fit in 4 vCPU. See AZURE-DEPLOY-RUNBOOK.md
  isolation: vpn-only
  auto_shutdown: "20:00 Europe/Madrid"
  budget_alert_usd: 60

forest:
  - domain: blackpearl.local
    netbios: BLACKPEARL
    functional_level: "2016"
    domain_controllers: 1

machines:
  - role: domain-controller
    # Server 2019 (not 2016): the target subscription only offers NVMe-only VM
    # sizes (Fasv7), and the Server 2016 image is SCSI-only so it cannot boot on
    # them. Domain functional_level stays 2016 below. See AZURE-DEPLOY-RUNBOOK.md.
    os: windows-server-2019
    domain: blackpearl.local
    count: 1
  - role: workstation
    os: windows-10-22h2
    domain: blackpearl.local
    count: 1

population:
  users: 22
  density: sparse
  seed: 1717   # Golden Age of Piracy flavor seed; kept explicit and stable (invariant #5)

# =============================================================================
# CTF ATTACK-CHAIN DESIGN — "Chart the Black Pearl" — one coherent foothold ->
# escalation -> Domain Admin path.
# -----------------------------------------------------------------------------
# attack_chain.mode: ctf (below) makes resolve_attack_chain() reuse the SAME
# real population objects across the three steps, so exploiting step N is a
# genuine prerequisite for step N+1. All 3 vulns are service-free
# (requires_services: []) and valid on this DC + workstation topology (no
# member-server, so adcs-esc1 / esc4-template-acl are intentionally NOT
# selected). This is the same proven chain as avengers-lab-azure.yml's
# "Black Widow" chain, retold with a pirate narrative.
#
#   1. asreproast   T1558.004  Steal/Forge Kerberos Tickets: AS-REP Roasting
#      Narrative: "Steal the captain's map" — a deckhand's account has
#      Kerberos pre-auth disabled; no credentials needed to request its
#      AS-REP and crack it offline, giving the first foothold on the ship.
#   2. kerberoasting T1558.003  Steal/Forge Kerberos Tickets: Kerberoasting
#      Narrative: "Board the ship" — now authenticated as a crew member,
#      request a TGS for a quartermaster service account (SPN) and crack its
#      weak password to gain a more privileged berth aboard the Black Pearl.
#   3. dcsync-acl    T1003.006  OS Credential Dumping: DCSync
#      Narrative: "Plunder the treasury" — that quartermaster account holds
#      domain replication rights; DCSync the krbtgt hash from the DC and take
#      the entire crew's chest -> Domain Admin over BLACKPEARL.LOCAL.
#   Objective: Domain Admin / full BLACKPEARL.LOCAL compromise (dump krbtgt,
#   golden ticket).
# =============================================================================
vulnerabilities:
  - asreproast
  - kerberoasting
  - dcsync-acl

attack_chain:
  mode: ctf

defense:
  profile: realistic
    # NOTE: baseline-controls (not cis-l1) — keeps hardening OS-agnostic (only the
    # individual hardening.controls.* toggles, no ansible-lockdown CIS/STIG role).
    # The realistic profile's other defaults still apply.
  hardening:
    baseline: baseline-controls
    apply_to: all
    controls:
      laps: true
    intentional_gaps_auto: true
  edr:
    - product: defender-av
      mode: enabled
      settings: { asr_rules: audit, tamper_protection: true, network_protection: true }
      targets: all
  deception:
    honey_accounts: 2
    canarytokens: []

on_conflict: exclude-control

detection_rules: auto

validation:
  bloodhound: true
  pingcastle: true
  atomic_red_team:
    - T1558.004   # asreproast
    - T1558.003   # kerberoasting
    - T1003.006   # dcsync-acl
