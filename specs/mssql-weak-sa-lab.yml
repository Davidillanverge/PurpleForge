# PurpleForge — MSSQL weak-sa smoke test (Tier B, first app vuln).
#
# PURPOSE: exercise the new service-provisioning phase (installs SQL Server
# 2019 Express SECURELY on the member-server declaring services:[mssql]) and
# the mssql-weak-sa vuln (enables sa + Mixed Mode auth + xp_cmdshell on top
# of that secure baseline). First-ever live deploy of both. Smallest topology
# that can host it: DC + one member-server.
#
# SIZING / QUOTA (same subscription pattern as acl-abuse-lab.yml): HARD
# 4-total-vCPU-per-region quota in eastus; Standard_F1as_v7 (1 vCPU, 4GB) is
# the only confirmed-unrestricted SKU. Budget: DC (1) + member-server/mssql
# (1) + WireGuard bastion (1) = 3 vCPU, 1 vCPU headroom. 4GB RAM is AT SQL
# Server Express's recommended minimum alongside Windows Server itself —
# watch for resource starvation on first live run.
lab:
  name: mssql-weak-sa-lab
  theme: corporate
  provider: azure
  region: eastus
  isolation: vpn-only
  auto_shutdown: "20:00 Europe/Madrid"
  budget_alert_usd: 30

forest:
  - domain: corp.local
    netbios: CORP
    functional_level: "2016"
    domain_controllers: 1

machines:
  - role: domain-controller
    os: windows-server-2019
    domain: corp.local
    count: 1
  - role: member-server
    os: windows-server-2019
    domain: corp.local
    services: [mssql]
    count: 1

population:
  users: 15
  density: sparse
  seed: 42

vulnerabilities:
  - mssql-weak-sa   # requires_services:[mssql] -> routes to the member-server above

attack_chain:
  mode: independent   # target_shape: none — no population account to cast

defense:
  profile: realistic
  hardening:
    baseline: baseline-controls
    apply_to: all
    controls:
      laps: true
    intentional_gaps_auto: true
  edr:
    - product: defender-av
      mode: enabled
      settings: { asr_rules: audit, tamper_protection: true, network_protection: true }
      targets: all
  deception:
    honey_accounts: 0
    canarytokens: []

on_conflict: exclude-control

detection_rules: auto

validation:
  bloodhound: false
  pingcastle: false
  atomic_red_team: []
