# PurpleForge — Springfield lab (Azure).
lab:
  name: springfield-lab
  theme: the-simpsons
  provider: azure
  region: westeurope
  isolation: vpn-only
  auto_shutdown: "20:00 Europe/Madrid"
  budget_alert_usd: 60

forest:
  - domain: springfield.local
    netbios: SPRINGFIELD
    functional_level: "2016"
    domain_controllers: 1

machines:
  - role: domain-controller
    os: windows-server-2022
    domain: springfield.local
    count: 1
  - role: workstation
    os: windows-11-23h2
    domain: springfield.local
    count: 2

population:
  users: 50
  density: realistic
  seed: 742   # 742 Evergreen Terrace

vulnerabilities:               # the deliberate gaps requested
  - asreproast
  - kerberoasting
  - constrained-delegation

defense:
  profile: none
  # Only the three controls explicitly requested — no CIS/STIG benchmark
  # sweep (hardening.baseline: baseline-controls means no ansible-lockdown
  # role runs at all, see catalog/defense/hardening/baseline-controls.yml).
  hardening:
    baseline: baseline-controls
    apply_to: all
    controls:
      laps: true
      lsa_protection: true
    intentional_gaps_auto: true
  edr:
    - product: defender-av
      mode: enabled
      settings: { asr_rules: audit, tamper_protection: true, network_protection: true }
      targets: all
  deception:
    honey_accounts: 0
    canarytokens: []

# NOTE: none of asreproast/kerberoasting/constrained-delegation's
# neutralized_by references laps, lsa_protection, or baseline-controls — this
# hardening set genuinely does not conflict with any of the 3 requested
# vulns (verified via `forge.py lab-spec --check-only`, not assumed). All
# three stay exploitable with zero exclusions needed.
on_conflict: exclude-control

detection_rules: none

validation:
  bloodhound: false
  pingcastle: false
  atomic_red_team: []
