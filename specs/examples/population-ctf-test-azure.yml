# PurpleForge — live-verification lab for the Python population generator
# (scripts/population.py, full BadBlood replacement) and attack_chain: ctf
# real-object casting/chaining. 1 DC + 1 member-server, corporate theme.
# Vulns picked to exercise both target_shapes: kerberoasting/dnsadmins-privesc/
# rbcd-abuse (account, expected to chain onto the same real user) and
# laps-read-acl (group_scope, narrowed to a real bulk group or the chained
# account).
lab:
  name: population-ctf-test
  theme: corporate
  provider: azure
  region: eastus   # hard 4-total-vCPU-per-region quota on this subscription; Standard_F1as_v7 (1 vCPU) is the only unrestricted SKU here — see AZURE-DEPLOY-RUNBOOK.md
  isolation: vpn-only
  auto_shutdown: "20:00 Europe/Madrid"
  budget_alert_usd: 50

forest:
  - domain: test.local
    netbios: TEST
    functional_level: "2016"
    domain_controllers: 1

machines:
  - role: domain-controller
    os: windows-server-2022
    domain: test.local
    count: 1
  - role: member-server
    os: windows-server-2022
    domain: test.local
    count: 1

population:
  users: 15
  density: sparse
  seed: 42

vulnerabilities:
  - kerberoasting
  - dnsadmins-privesc
  - rbcd-abuse
  - laps-read-acl

attack_chain:
  mode: ctf

defense:
  profile: none
  hardening:
    baseline: baseline-controls
    apply_to: all
    controls:
      laps: true
    intentional_gaps_auto: true
  edr:
    - product: defender-av
      mode: enabled
      settings: { asr_rules: audit, tamper_protection: true, network_protection: true }
      targets: all
  deception:
    honey_accounts: 0
    canarytokens: []

on_conflict: exclude-control

detection_rules: none

validation:
  bloodhound: false
  pingcastle: false
  atomic_red_team: []
