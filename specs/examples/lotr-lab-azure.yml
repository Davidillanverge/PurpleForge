# PurpleForge — Middle-earth lab (Azure).
lab:
  name: middle-earth-lab
  theme: the-lord-of-the-rings
  provider: azure
  region: westeurope
  isolation: vpn-only
  auto_shutdown: "20:00 Europe/Madrid"
  budget_alert_usd: 60

forest:
  - domain: middleearth.local
    netbios: MIDDLEEARTH
    functional_level: "2016"
    domain_controllers: 1

machines:
  - role: domain-controller
    os: windows-server-2022
    domain: middleearth.local
    count: 1
  - role: member-server
    os: windows-server-2022
    domain: middleearth.local
    count: 1
  - role: workstation
    os: windows-11-23h2
    domain: middleearth.local
    count: 2

population:
  users: 50
  density: realistic
  seed: 3019   # year the Fellowship set out (Third Age 3019)

vulnerabilities:               # the deliberate gaps requested
  - asreproast
  - kerberoasting

defense:
  profile: none
  # Only the two controls explicitly requested — no CIS/STIG benchmark
  # sweep (hardening.baseline: baseline-controls means no ansible-lockdown
  # role runs at all, see catalog/defense/hardening/baseline-controls.yml).
  hardening:
    baseline: baseline-controls
    apply_to: all
    controls:
      laps: true
    intentional_gaps_auto: true
  edr:
    - product: defender-av
      mode: enabled
      settings: { asr_rules: audit, tamper_protection: true, network_protection: true }
      targets: all
  deception:
    honey_accounts: 0

# NOTE: neither asreproast's nor kerberoasting's neutralized_by references
# laps or baseline-controls — this hardening set genuinely does not conflict
# with either requested vuln (verified via `forge.py lab-spec --check-only`,
# not assumed). Both stay exploitable with zero exclusions needed.
on_conflict: exclude-control

validation:
  bloodhound: false
  pingcastle: false
  atomic_red_team: []
