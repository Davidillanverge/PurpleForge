# PurpleForge — Springfield office lab (Azure).
# 1 DC + 1 member Windows Server + 2 workstations, LAPS enabled, and only
# kerberoasting + asreproast as the intentional gaps (no constrained-delegation,
# unlike specs/examples/simpsons-lab-azure.yml).
lab:
  name: springfield-office-lab
  theme: the-simpsons
  provider: azure
  region: swedencentral   # westeurope/northeurope both reject the B-series VM family on this subscription; confirmed Dv3-series + Windows-11/WindowsServer marketplace images available here
  isolation: vpn-only
  auto_shutdown: "20:00 Europe/Madrid"
  budget_alert_usd: 60

forest:
  - domain: springfield.local
    netbios: SPRINGFIELD
    functional_level: "2016"
    domain_controllers: 1

machines:
  - role: domain-controller
    os: windows-server-2022
    domain: springfield.local
    count: 1
  - role: member-server
    os: windows-server-2022
    domain: springfield.local
    count: 1
  - role: workstation
    os: windows-11-23h2
    domain: springfield.local
    count: 2

population:
  users: 50
  density: realistic
  seed: 742   # 742 Evergreen Terrace

vulnerabilities:               # the deliberate gaps requested
  - asreproast
  - kerberoasting

defense:
  profile: none
  # baseline-controls = no CIS/STIG ansible-lockdown sweep runs at all (see
  # catalog/defense/hardening/baseline-controls.yml); LAPS is the only fixed
  # control requested. Neither asreproast nor kerberoasting's neutralized_by
  # references hardening.controls.laps, and cis-l2/stig are not applied here,
  # so both stay exploitable with zero reconciliation exclusions needed.
  hardening:
    baseline: baseline-controls
    apply_to: all
    controls:
      laps: true
    intentional_gaps_auto: true
  edr:
    - product: defender-av
      mode: enabled
      settings: { asr_rules: audit, tamper_protection: true, network_protection: true }
      targets: all
  deception:
    honey_accounts: 0
    canarytokens: []

on_conflict: exclude-control

detection_rules: none

validation:
  bloodhound: false
  pingcastle: false
  atomic_red_team: []
