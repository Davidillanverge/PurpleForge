# PurpleForge — Star Wars lab (Azure).
# 1 DC (Windows Server 2016) + 1 member Windows Server + 1 workstation.
# Intentional gaps: asreproast + kerberoasting + constrained-delegation.
# region: eastus — this subscription has a hard 4-total-vCPU-per-region
# compute quota with every 1-vCPU SKU restricted in swedencentral; eastus is
# where Standard_F1as_v7 (1 vCPU, 4GB) is confirmed unrestricted, letting all
# 4 hosts (bastion+dc+mbr+ws) fit in the 4-vCPU budget — see
# AZURE-DEPLOY-RUNBOOK.md and generated/star-wars-lab/terraform/azure/
# sizes.auto.tfvars.json (hand-added post-generate, not part of `generate`
# output — Terraform auto-loads *.auto.tfvars.json).
lab:
  name: star-wars-lab
  theme: star-wars
  provider: azure
  region: eastus
  isolation: vpn-only
  auto_shutdown: "20:00 Europe/Madrid"
  budget_alert_usd: 50

forest:
  - domain: empire.local
    netbios: EMPIRE
    functional_level: "2016"
    domain_controllers: 1

machines:
  - role: domain-controller
    os: windows-server-2016
    domain: empire.local
    count: 1
  - role: member-server
    os: windows-server-2022
    domain: empire.local
    count: 1
  - role: workstation
    os: windows-11-23h2
    domain: empire.local
    count: 1

population:
  users: 40
  density: realistic
  seed: 66   # Order 66

vulnerabilities:               # the deliberate gaps requested
  - asreproast
  - kerberoasting
  - constrained-delegation

defense:
  profile: none
  # No hardening/EDR/LAPS requested for this lab — pure offensive practice,
  # matching catalog/defense/profiles/none.yml's own description. Nothing
  # here neutralizes any of the three selected vulns anyway (their
  # neutralized_by entries are all either unverified conceptual labels or
  # tied to cis-l2/stig baselines, both unused here), so on_conflict has
  # nothing to reconcile.

on_conflict: exclude-control

detection_rules: none

validation:
  bloodhound: false
  pingcastle: false
  atomic_red_team: []
