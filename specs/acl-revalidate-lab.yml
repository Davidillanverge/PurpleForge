# PurpleForge — minimal re-validation lab for the two fixed injection bugs.
#
# PURPOSE: prove, on a live domain, that the 2026-07-10 fixes to
#   - writable-gpo (PS operator-precedence bug -> GPO now actually linked at root)
#   - adminsdholder-acl (Set-Acl silent no-op -> now -ErrorAction Stop + post-write
#     Get-Acl verification that throws if the GenericAll ACE didn't persist)
# both land the intended AD artifact. Nothing else — smallest possible lab.
#
# Both vulns are domain-level/account-shaped, so they land on the single root DC;
# no member-server / ADCS needed (that was esc4's requirement in acl-abuse-lab).
#
# SIZING / QUOTA (same subscription as acl-abuse-lab): HARD 4-total-vCPU-per-region
# quota in eastus; Standard_F1as_v7 (1 vCPU, 4GB) is the only confirmed-unrestricted
# SKU. Budget: domain-controller (1) + WireGuard bastion (1) = 2 vCPU, well under cap.
lab:
  name: acl-revalidate-lab
  theme: star-wars
  provider: azure
  region: eastus
  isolation: vpn-only
  auto_shutdown: "20:00 Europe/Madrid"
  budget_alert_usd: 30

forest:
  - domain: empire.local
    netbios: EMPIRE
    functional_level: "2016"
    domain_controllers: 1

machines:
  - role: domain-controller
    # Server 2019 (not 2016): target subscription only offers NVMe-only sizes
    # (Fasv7); the Server 2016 image is SCSI-only and cannot boot on them.
    os: windows-server-2019
    domain: empire.local
    count: 1

# Small population, but realistic density so ctf mode has a real low-priv pool to
# cast the pivot onto. seed 66 = "Order 66" (matches acl-abuse-lab's theme intent).
population:
  users: 15
  density: realistic
  seed: 66

# ctf mode: the FIRST account-shaped vuln (writable-gpo) casts ONE real pivot user;
# adminsdholder-acl reuses that same user. Compromising the pivot drives both edges.
vulnerabilities:
  - writable-gpo       # account — ANCHOR pivot (GenericWrite on GPO linked at root)
  - adminsdholder-acl  # account — reuse pivot (GenericAll on AdminSDHolder)

attack_chain:
  mode: ctf

defense:
  profile: realistic
  hardening:
    baseline: baseline-controls
    apply_to: all
    controls:
      laps: true
    intentional_gaps_auto: true
  edr:
    - product: defender-av
      mode: enabled
      settings: { asr_rules: audit, tamper_protection: true, network_protection: true }
      targets: all
  deception:
    honey_accounts: 2

on_conflict: exclude-control

validation:
  bloodhound: true
  pingcastle: true
  atomic_red_team:
    - T1484.001   # writable-gpo (validate.atomic: T1484.001); adminsdholder-acl has no atomic
