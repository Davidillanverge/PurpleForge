# Alembic config for the PurpleForge agent service DB (src/db/).
# The URL comes from PF_DATABASE_URL (db.settings.DatabaseSettings), not from here.
#   alembic upgrade head          # apply
#   alembic revision --autogenerate -m "..."   # new migration after a model change
[alembic]
script_location = %(here)s/src/db/migrations
prepend_sys_path = %(here)s/src %(here)s/scripts
path_separator = space
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
