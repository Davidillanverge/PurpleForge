# Golden-test fixture (NOT a demo lab): minimal single-DC Azure case — no vulns,
# no hardening, sparse population. Exercises the baseline manifest: 1-domain IP
# plan, jumpbox placement, per-machine cost, empty reconciliation. Referenced by
# name in test_plan.py and test_guardrail.py.
lab:
  name: single-dc
  theme: corporate
  provider: azure
  region: westeurope
  isolation: vpn-only
  auto_shutdown: "20:00 Europe/Madrid"
  budget_alert_usd: 50

forest:
  - domain: test.local
    netbios: TEST
    functional_level: "2016"
    domain_controllers: 1

machines:
  - role: domain-controller
    os: windows-server-2019
    domain: test.local
    count: 1

population:
  users: 10
  density: sparse
  seed: 1

vulnerabilities: []

defense:
  profile: none

on_conflict: warn

validation:
  bloodhound: false
  pingcastle: false
  atomic_red_team: []
