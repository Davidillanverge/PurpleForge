# Golden-test fixture (NOT a demo lab): the AWS provider + cis-l2 hardened profile +
# the FIXED-TOGGLE reconciliation path — unconstrained-delegation is neutralized by
# the lsa_protection control (a hardening.controls.* toggle, not a baseline rule),
# so on_conflict: exclude-control flips that toggle in defense_resolved. Also a
# `messy` population density and iis/mssql services.
lab:
  name: fixed-toggle
  theme: corporate
  provider: aws
  region: eu-west-1
  isolation: vpn-only
  auto_shutdown: "19:00 Europe/Madrid"
  budget_alert_usd: 100

forest:
  - domain: ravencorp.local
    netbios: RAVENCORP
    functional_level: "2016"
    domain_controllers: 1

machines:
  - role: domain-controller
    os: windows-server-2022
    domain: ravencorp.local
    count: 1
  - role: member-server
    os: windows-server-2022
    domain: ravencorp.local
    services: [iis, mssql]
    count: 1
  - role: workstation
    os: windows-11-23h2
    domain: ravencorp.local
    count: 3

population:
  users: 30
  density: messy
  seed: 4242

vulnerabilities:
  - asreproast
  - unconstrained-delegation
  - passwords-in-description

defense:
  profile: hardened
  edr:
    - product: defender-av
      mode: enabled
      settings: { asr_rules: block, tamper_protection: true, network_protection: true }
      targets: all
  hardening:
    baseline: cis-l2
    apply_to: all
    controls:
      laps: true
      lsa_protection: true
      credential_guard: true
      smb_signing: enforce
      ldap_signing: enforce
      disable_llmnr_nbtns_mdns: true
      protected_users_group: [RAVENCORP\da-finance]
    intentional_gaps_auto: true
  deception:
    honey_accounts: 2

on_conflict: exclude-control

validation:
  bloodhound: true
  pingcastle: true
  atomic_red_team: [T1558.004, T1187, T1552]
