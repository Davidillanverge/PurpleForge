# Golden-test fixture (NOT a demo lab): the Proxmox provider path — a $0 cost
# estimate (no per-hour billing), the proxmox network_plan, and a baseline-controls
# defense (fixed toggles only, no ansible-lockdown baseline, so no skip_rule
# reconciliation). Small member-server-less domain.
lab:
  name: single-dc-proxmox
  theme: corporate
  provider: proxmox
  region: home-lab
  isolation: vpn-only
  auto_shutdown: "20:00 Europe/Madrid"
  budget_alert_usd: 10

forest:
  - domain: corp.local
    netbios: CORP
    functional_level: "2016"
    domain_controllers: 1

machines:
  - role: domain-controller
    os: windows-server-2022
    domain: corp.local
    count: 1
  - role: workstation
    os: windows-11-23h2
    domain: corp.local
    count: 1

population:
  users: 8
  density: sparse
  seed: 7

vulnerabilities:
  - kerberoasting

defense:
  profile: none
  hardening:
    baseline: baseline-controls
    apply_to: all
    controls:
      laps: true
      smb_signing: enforce
      ldap_signing: enforce

on_conflict: warn

validation:
  bloodhound: false
  pingcastle: false
  atomic_red_team: []
