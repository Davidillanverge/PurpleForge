# Golden-test fixture (NOT a demo lab): two-domain Azure forest with a parent-child
# trust. Exercises the multi-domain IP plan (a /24 per domain), trust references,
# adcs+mssql services, the full realistic defense stack (Defender AV + cis-l1 +
# fixed controls + honey accounts), and the baseline-bundled reconciliation
# exclusion path (gpp-cpassword ⟷ cis-l1, on_conflict: exclude-control). Referenced
# by name in test_plan.py for the multi-domain assertions.
lab:
  name: two-domain
  theme: medieval-kingdom
  provider: azure
  region: westeurope
  isolation: vpn-only
  auto_shutdown: "20:00 Europe/Madrid"
  budget_alert_usd: 150

forest:
  - domain: kingdom.local
    netbios: KINGDOM
    functional_level: "2016"
    domain_controllers: 1
  - domain: vassals.kingdom.local
    netbios: VASSALS
    functional_level: "2016"
    domain_controllers: 1
    trust:
      target: kingdom.local
      type: parent-child

machines:
  - role: domain-controller
    os: windows-server-2019
    domain: kingdom.local
    count: 1
  - role: domain-controller
    os: windows-server-2019
    domain: vassals.kingdom.local
    count: 1
  - role: member-server
    os: windows-server-2022
    domain: kingdom.local
    services: [adcs, mssql]
    count: 1
  - role: workstation
    os: windows-10-22h2
    domain: kingdom.local
    count: 2

population:
  users: 40
  density: realistic
  seed: 1337

vulnerabilities:
  - kerberoasting
  - adcs-esc1
  - gpp-cpassword
  - dcsync-acl

defense:
  profile: realistic
  edr:
    - product: defender-av
      mode: enabled
      settings: { asr_rules: audit, tamper_protection: true, network_protection: true }
      targets: all
  hardening:
    baseline: cis-l1
    apply_to: all
    controls:
      laps: true
      lsa_protection: true
      credential_guard: false
      smb_signing: enforce
      ldap_signing: enforce
      disable_llmnr_nbtns_mdns: true
      protected_users_group: [KINGDOM\da-treasury]
    intentional_gaps_auto: true
  deception:
    honey_accounts: 3

on_conflict: exclude-control

validation:
  bloodhound: true
  pingcastle: true
  atomic_red_team: [T1558.003, T1552.006, T1649]
